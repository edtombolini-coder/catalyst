n 154 g of C4H8O3?", "o": ["46%", "31%", "27%", "72%", "55%"], "a": 0, "e": "Official key: 46%.", "r": "Exam sample 5 Q10", "off": 1, "w": ["M<sub>r</sub>(C<sub>4</sub>H<sub>8</sub>O<sub>3</sub>) = 4(12.01) + 8(1.008) + 3(16.00) = 104.10 g/mol.", "% C = 4(12.01)/104.10 × 100 = 46.1 % (the 154 g sample size is irrelevant: a percentage does not depend on the amount)."]}, {"s": "Electron configurations", "t": "pos", "q": "The outer electronic configuration ns2np4 corresponds to which one of the following elements in its ground state?", "o": ["As", "Cr", "Br", "Ca", "S"], "a": 4, "e": "Official key: S.", "r": "Exam sample 5 Q11", "off": 1}, {"s": "Quantum numbers", "t": "qn", "q": "Which atomic orbital is spherical in shape? (Note: you should know and be able to recognize the shapes of the s orbital, px, py, and pz orbitals, and dxy, dyz, dxz, dx2-y2 and dz2 orbitals.)", "o": ["they are all spherical", "2s", "4f", "3p", "3d"], "a": 1, "e": "Official key: 2s.", "r": "Exam sample 5 Q13", "off": 1}, {"s": "Atom & particles", "t": "sym", "q": "The species that contains 24 protons, 26 neutrons and 22 electrons would be represented by the symbol:", "o": ["50Cr2+", "50V3+", "26Cr2+", "none of these", "50Mn2+"], "a": 0, "e": "Official key: 50Cr2+.", "r": "Exam sample 5 Q14", "off": 1}, {"s": "Acids, bases & pH", "t": "abth", "q": "Which of the following statements is FALSE given the following net ionic equation? 2H+(aq) + Cu(OH)2(s) <-> Cu2+(aq) + 2H2O(l)", "o": ["The base, Cu(OH)2, is an insoluble base.", "If all the water evaporated away, the salt remaining could possibly be CuS.", "This is classified as a neutralization reaction.", "This could be the net ionic equation for HNO3 reacting with Cu(OH)2.", "The acid involved must be a strong electrolyte."], "a": 1, "e": "Official key: If all the water evaporated away, the salt remaining could possibly be CuS..", "r": "Exam sample 5 Q15", "off": 1}, {"s": "Acids, bases & pH", "t": "abth", "q": "In the Bronsted-Lowry system, a base is defined as:", "o": ["a proton acceptor.", "a proton donor.", "a hydroxide donor.", "a water-former.", "an electron-pair acceptor."], "a": 0, "e": "Official key: a proton acceptor..", "r": "Exam sample 5 Q17", "off": 1}, {"s": "Acids, bases & pH", "t": "ph", "q": "What is the pH of 500 mL of solution containing 0.0124 grams of Ca(OH)2?", "o": ["3.17", "9.68", "10.83", "11.04", "2.96"], "a": 2, "e": "Official key: 10.83.", "r": "Exam sample 5 Q20", "off": 1, "w": ["n[Ca(OH)<sub>2</sub>] = 0.0124/74.10 = 1.674e-04 mol in 0.500 L → 3.347e-04 M.", "[OH<sup>−</sup>] = 2 × 3.347e-04 = 6.694e-04 M → pOH = 3.17 → pH = 10.83."]}, {"s": "Atom & particles", "t": "avg", "q": "What is the atomic weight of a hypothetical element consisting of two isotopes, one with mass = 64.23 amu (26.0%), and one with mass = 65.32 amu?", "o": ["65.0 amu", "64.4 amu", "65.3 amu", "64.9 amu", "64.8 amu"], "a": 0, "e": "Official key: 65.0 amu.", "r": "Exam sample 5 Q24", "off": 1, "w": ["Data: isotope 1 = 64.23 amu (26.0%), isotope 2 = 65.32 amu (abundance not given). Find: atomic weight.", "Abundance of isotope 2 = 100 − 26.0 = 74.0%.", "Weighted average = 0.260 × 64.23 + 0.740 × 65.32 = 16.70 + 48.34 = 65.04 ≈ 65.0 amu.", "Plausibility: the result lies between 64.23 and 65.32, closer to the more abundant isotope (65.32) ✓. The simple mean (64.78) is the typical wrong option."]}, {"s": "Acids, bases & pH", "t": "strong", "q": "Which one of the following is a strong electrolyte?", "o": ["(CH3)3N", "HNO2", "HF", "H2O", "KF"], "a": 4, "e": "Official key: KF.", "r": "Exam sample 5 Q26", "off": 1}, {"s": "Mole & stoichiometry", "t": "pct", "q": "An oxide of lead contains 90.65% Pb, by weight. The empirical formula is:", "o": ["PbO2", "Pb", "PbO", "Pb3O4", "Pb2O3"], "a": 3, "e": "Official key: Pb3O4.", "r": "Exam sample 5 Q27", "off": 1, "w": ["Data: lead oxide with 90.65% Pb → 9.35% O. Assume 100 g.", "Pb: 90.65/207.2 = 0.4375 mol; O: 9.35/16.00 = 0.5844 mol; O/Pb = 1.336 ≈ 4/3.", "Multiply by 3 to get whole numbers: Pb : O = 3 : 4 → Pb<sub>3</sub>O<sub>4</sub>."]}, {"s": "Solutions & colligative properties", "t": "conc", "q": "How many equivalents of phosphoric acid are contained in 300 mL of 4.00 M phosphoric acid? (Assume the acid is to be completely neutralized by a base.)", "o": ["1.20 eq", "3.60 eq", "0.600 eq", "2.40 eq", "4.80 eq"], "a": 1, "e": "Official key: 3.60 eq.", "r": "Exam sample 5 Q28", "off": 1, "w": ["n(H<sub>3</sub>PO<sub>4</sub>) = 4.00 mol/L × 0.300 L = 1.20 mol.", "Complete neutralization: 3 H<sup>+</sup> per molecule → equivalents = 3 × 1.20 = 3.60 eq."]}, {"s": "Acids, bases & pH", "t": "abth", "q": "Which of the following statements is FALSE given the following net ionic equation? H3PO4(aq) + 3OH-(aq) <-> PO43-(aq) + 3H2O(l)", "o": ["This could be the net ionic equation for H3PO4 reacting with Al(OH)3.", "If all the water evaporated away, the salt remaining could possibly be Na3PO4.", "This is classified as a neutralization reaction.", "The acid, H3PO4, is a weak electrolyte.", "The base involved must be a strong soluble base."], "a": 0, "e": "Official key: This could be the net ionic equation for H3PO4 reacting with Al(OH)3..", "r": "Exam sample 5 Q30", "off": 1}, {"s": "Organic chemistry", "t": "isom", "q": "Which of the following molecules is NOT an isomer of the HEXANE:", "o": ["A", "B, C", "B", "A, C"], "a": 2, "fig": "E23Q3", "alt": "Four structures: (A) 2-methylpentane, (B) cyclohexane, (C) 2,2-dimethylbutane, (D) 2,3-dimethylbutane", "e": "Official key: B. Hexane is C6H14, so an isomer must also be C6H14. A (2-methylpentane), C (2,2-dimethylbutane) and D (2,3-dimethylbutane) are branched alkanes with 6 C and 14 H. B is cyclohexane: a ring has two H fewer (C6H12), so it is not an isomer of hexane.", "r": "Exam 23/01/2023 Q3 (figure)", "off": 1, "w": ["Data: hexane = C<sub>6</sub>H<sub>14</sub>. Find: the structure that is NOT an isomer (isomers = same molecular formula, different structure).", "(A) CH<sub>3</sub>CH(CH<sub>3</sub>)CH<sub>2</sub>CH<sub>2</sub>CH<sub>3</sub>: 6 C, 14 H → C<sub>6</sub>H<sub>14</sub> ✓ isomer.", "(B) six CH<sub>2</sub> in a ring: C<sub>6</sub>H<sub>12</sub> ✗ (a ring removes 2 H: C<sub>n</sub>H<sub>2n</sub>).", "(C) CH<sub>3</sub>C(CH<sub>3</sub>)<sub>2</sub>CH<sub>2</sub>CH<sub>3</sub>: 6 C, 14 H ✓. (D) (CH<sub>3</sub>)<sub>2</sub>CHCH(CH<sub>3</sub>)<sub>2</sub>: 6 C, 14 H ✓.", "Only B differs, so the correct answer is the option that says just “B”."]}, {"s": "Organic chemistry", "t": "otype", "q": "Determine the type of the following reaction:", "o": ["substitution", "This reaction is not correct", "elimination", "addition"], "a": 3, "fig": "E23Q21", "alt": "2-butene + Cl2 gives 2,3-dichlorobutane", "e": "Official key: addition. 2-Butene (a C=C double bond) reacts with Cl2 and gives 2,3-dichlorobutane: the double bond becomes a single bond and one Cl is attached to each carbon.", "r": "Exam 23/01/2023 Q21 (figure)", "off": 1}, {"s": "Organic chemistry", "t": "ofg", "q": "Identify the functional group in the molecule below:", "o": ["carboxylic acid", "ester", "ketone", "alkene"], "a": 2, "fig": "E23Q22", "alt": "Skeletal formula of pentan-2-one: a C=O on carbon 2 of a five-carbon chain", "e": "Official key: ketone. The carbonyl group C=O is bonded to two carbon atoms (inside the chain), with no O–H (acid) and no second O (ester), and there is no C=C. This is pentan-2-one.", "r": "Exam 23/01/2023 Q22 (figure)", "off": 1}, {"s": "Organic chemistry", "t": "oname", "q": "The name of this molecule is:", "o": ["4-hydroxy-4-methyl-2-pentenoic acid", "4-hydroxy-4-methyl-2-pentanone", "4-hydroxy-4-methyl-2-pentene", "4-hydroxy-4-methylpentane"], "a": 1, "fig": "E23Q23", "alt": "CH3-C(OH)(CH3)-CH2-C(=O)-CH3", "e": "Official key: 4-hydroxy-4-methyl-2-pentanone. Longest chain with the C=O: 5 C (pentane); the ketone C=O is numbered from the end that gives it the lowest number (C2: -2-one). OH and CH3 are both on C4. There is no C=C (so not -ene/-enoic) and no COOH.", "r": "Exam 23/01/2023 Q23 (figure)", "off": 1}];
var OFFX={"0": "Arrhenius: an acid is a substance that releases H<sup>+</sup> (H<sub>3</sub>O<sup>+</sup>) in water, a base one that releases OH<sup>−</sup>. “Donates a proton” is Brønsted–Lowry; “accepts an electron pair” is a Lewis acid.", "1": "Pure water autoionizes: 2H<sub>2</sub>O ⇌ H<sub>3</sub>O<sup>+</sup> + OH<sup>−</sup>, producing the two ions in equal amounts, so [H<sub>3</sub>O<sup>+</sup>] = [OH<sup>−</sup>] at any temperature. The value 1.0×10<sup>−7</sup> M (pH = pOH = 7) holds only at 25 °C, because K<sub>w</sub> changes with temperature.", "2": "Solubility of hydroxides: group 1 are very soluble; group 2 hydroxides increase in solubility going down the group. Ca(OH)<sub>2</sub> is the only alkaline-earth hydroxide in the list; the hydroxides of Zr, Cu, Zn and Ga are practically insoluble.", "4": "Acid + base → salt + water: 2HClO<sub>3</sub> + Ba(OH)<sub>2</sub> → Ba(ClO<sub>3</sub>)<sub>2</sub> + 2H<sub>2</sub>O. The salt takes the cation from the base (Ba<sup>2+</sup>) and the anion from the acid (ClO<sub>3</sub><sup>−</sup>, chlorate); charge balance needs two chlorates per barium. H<sub>2</sub>O is the other product, not the salt.", "6": "The double arrow means the reaction is reversible (equilibrium): NH<sub>3</sub> reacts only partially with water. It says nothing about solubility, and NH<sub>3</sub> is in fact very soluble in water. The other statements are true: 1 NH<sub>3</sub> gives 1 NH<sub>4</sub><sup>+</sup> and 1 OH<sup>−</sup>; NH<sub>3</sub> is a weak base; mixing NH<sub>4</sub>Cl and NaOH pushes the equilibrium back and releases NH<sub>3</sub>.", "7": "Lewis theory: a base is an electron-pair donor (“makes available a share in a pair of electrons”). Producing OH<sup>−</sup> is Arrhenius, proton acceptor is Brønsted–Lowry, and an electron-pair acceptor is a Lewis acid.", "12": "The azimuthal quantum number l goes from 0 to n − 1 (for n = 1 only l = 0). “l = 1, 2, 3 … n+1” is therefore wrong; the other statements are correct.", "13": "Ni has Z = 28: 28 − 18 = 10 electrons beyond [Ar], so [Ar] 4s<sup>2</sup> 3d<sup>8</sup>. [Kr] has 36 electrons, too many. Ni is not one of the irregular cases (Cr, Cu).", "15": "Most α particles went straight through the foil and a few were deflected strongly: the positive charge and almost all the mass are concentrated in a very small, heavy nucleus. Circular electron orbits are Bohr's model, not Rutherford's conclusion.", "16": "Size increases going down a group: P (period 3) is smaller than Sb (period 5), so the statement that P is larger is wrong. The others are true (a cation is smaller than its atom; F has a more negative electron affinity than O).", "22": "K<sub>c</sub> does not contain pure solids or liquids. ICl and I<sub>2</sub> are solids, so only the gas appears: K<sub>c</sub> = [Cl<sub>2</sub>].", "24": "A gas behaves ideally when molecular volume and intermolecular attractions are negligible: low pressure (molecules far apart) and high temperature (kinetic energy beats the attractions).", "29": "The Heisenberg principle is the uncertainty principle: position and momentum cannot both be known exactly. The second option is Pauli exclusion, the third is Hund's rule, the last is the definition of an element.", "32": "AlCl<sub>3</sub>: aluminium chloride (Al<sup>3+</sup>, so “(III)”). NH<sub>4</sub>ClO<sub>4</sub>: ClO<sub>4</sub><sup>−</sup> is perchlorate (ClO<sub>3</sub><sup>−</sup> chlorate, ClO<sub>2</sub><sup>−</sup> chlorite, ClO<sup>−</sup> hypochlorite). Fe(NO<sub>3</sub>)<sub>3</sub>: three NO<sub>3</sub><sup>−</sup> means Fe<sup>3+</sup>, iron(III) nitrate.", "41": "Mg(OH)<sub>2</sub> + H<sub>2</sub>SO<sub>4</sub> → MgSO<sub>4</sub> + 2H<sub>2</sub>O. The ratio Mg(OH)<sub>2</sub> : MgSO<sub>4</sub> is 1 : 1 and the acid is in excess, so Mg(OH)<sub>2</sub> is limiting: 5 mol → 5 mol of salt.", "43": "Le Chatelier: the system opposes the change. Adding reactant A is relieved by consuming it, so the equilibrium shifts right. Removing A, or adding product C or D, shifts it left.", "44": "A dative bond is a covalent bond whose shared pair comes from one atom only. Following the Lewis structures used in class, the key assigns one dative bond to the nitrate and sulfite ions and none to nitrite, which can be drawn with a double and a single N–O bond and a lone pair on N. The key depends on those structures; see the note on this question.", "46": "SO<sub>2</sub>: S has 2 bonded atoms and 1 lone pair = 3 electron domains, so sp<sup>2</sup> (bent molecule).", "48": "“5d” means n = 5 and l = 2. m<sub>l</sub> runs from −l to +l, i.e. −2…+2, so 3 is impossible; l = 4 would be 5g; n = 6 would be 6d.", "52": "Cis–trans isomerism needs two different groups on each carbon of the double bond. In 1,1-dichloroethene both Cl are on the same carbon, so there is no isomerism. 1,2-dichloroethene, 3-hexene and 2-pentene each have two different groups on both carbons.", "53": "Na (11 electrons) is 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>1</sup>. Na<sup>+</sup> loses the 3s electron: 10 electrons, the neon configuration.", "55": "Common-ion effect: CaBr<sub>2</sub> ⇌ Ca<sup>2+</sup> + 2Br<sup>−</sup>. Adding a salt or acid that supplies Ca<sup>2+</sup> (CaCl<sub>2</sub>) or Br<sup>−</sup> (HBr) pushes the equilibrium towards the solid and lowers the solubility. HCl and H<sub>2</sub>SO<sub>4</sub> bring no common ion.", "59": "K depends only on temperature. It is not changed by a catalyst (which speeds up both directions equally) or by changes of concentration (these change Q, not K).", "61": "Phosphorous acid is H<sub>3</sub>PO<sub>3</sub>; H<sub>3</sub>PO<sub>4</sub> is phosphoric acid. The other pairs are right (chromate CrO<sub>4</sub><sup>2−</sup>, acetate CH<sub>3</sub>COO<sup>−</sup>, hypobromite BrO<sup>−</sup>, nitrogen oxide NO).", "64": "Chemical equilibrium is dynamic: forward and reverse rates are equal and not zero, so neither reaction has stopped. The concentrations are constant, but they need not be equal.", "65": "Neutrons = A − Z: Zn 72 − 30 = 42, As 75 − 33 = 42, Ge 74 − 32 = 42. Protons (30, 33, 32) and mass numbers differ.", "66": "This is electronegativity, which increases towards the upper right of the table. Br (group 17, period 4) is the most electronegative of Se, Bi, As, Ge and Br.", "67": "Mo is [Kr] 5s<sup>1</sup> 4d<sup>5</sup>: the last electron enters the 4d subshell, so n = 4 and l = 2. The other sets have an impossible m<sub>l</sub> (9), are s electrons, or refer to 5d (empty) or 3d (a full inner subshell). Which m<sub>l</sub> and m<sub>s</sub> belong to the fifth d electron depends on the filling convention; the key picks the set with the right n and l.", "69": "BaCl<sub>2</sub> + H<sub>2</sub>SO<sub>4</sub> → BaSO<sub>4</sub>(s) + 2HCl. Barium sulfate is the insoluble white precipitate (sulfate SO<sub>4</sub><sup>2−</sup>; sulfite would be BaSO<sub>3</sub>).", "73": "One mole of any substance contains the same number of particles, N<sub>A</sub> = 6.022×10<sup>23</sup>, whatever its identity or physical state.", "74": "Ionization energy decreases down a group (the outer electron is farther away and more shielded). Xe is the lowest of the noble gases listed.", "75": "Lowest pH means most acidic. NaOH and NH<sub>3</sub> are basic, pure water is neutral. Of the two acids, benzoic acid (K<sub>a</sub> ≈ 6×10<sup>−5</sup>) is much stronger than hypochlorous acid (K<sub>a</sub> ≈ 3×10<sup>−8</sup>); these K<sub>a</sub> values are approximate table values added here, not given in the exam.", "85": "The proton is +1; the electron is −1, the neutron is neutral, an atom is neutral and an anion is negative.", "89": "Mn, Fe, Co, Ni and Cu are filling the 3d subshell: d-block, i.e. transition metals.", "90": "Alkaline earth metals are group 2. In period 3 the group-2 element is Mg (Ca is period 4, Sr period 5; Li and Na are group 1).", "91": "The density of a gas is d = MP/(RT), so it depends on pressure as well as temperature: constant T does not make it constant. This is the false statement. The molecular weight of a compound is fixed, gases mix by diffusion, need confinement and expand without limit.", "92": "Avogadro's law: equal volumes of gases at the same T and P contain the same number of molecules. The densities differ (they depend on molar mass), the molecular speeds differ (lighter molecules are faster at the same T), and the numbers of molecules are equal, not 2:1.", "94": "As has Z = 33: [Ar] 4s<sup>2</sup> 3d<sup>10</sup> 4p<sup>3</sup> (18 + 2 + 10 + 3 = 33). A d subshell holds at most 10 electrons and a p subshell at most 6.", "95": "l = 3 is an f subshell: 2l + 1 = 7 orbitals × 2 electrons = 14.", "100": "4NH<sub>3</sub> + 5O<sub>2</sub> → 4NO + 6H<sub>2</sub>O. N goes from −3 (NH<sub>3</sub>) to +2 (NO): it is oxidized. O goes from 0 (O<sub>2</sub>) to −2: O<sub>2</sub> is reduced, so it is the oxidizing agent. H stays +1.", "104": "ns<sup>2</sup>np<sup>4</sup> means 6 outer electrons: group 16. Among the options only S.", "105": "All s orbitals are spherical; p orbitals are dumbbell-shaped and d orbitals have cloverleaf (or d<sub>z²</sub> ring) shapes.", "106": "Z = 24 is chromium. A = 24 + 26 = 50. Charge = 24 − 22 = +2: <sup>50</sup>Cr<sup>2+</sup>.", "107": "The net ionic equation shows H<sup>+</sup> ions, so the acid is a strong electrolyte, and Cu(OH)<sub>2</sub> is written as a solid (insoluble base); it is a neutralization and could be HNO<sub>3</sub> + Cu(OH)<sub>2</sub>, leaving Cu(NO<sub>3</sub>)<sub>2</sub>. CuS is false: it would need H<sub>2</sub>S, a weak acid, which would not be written as free H<sup>+</sup>.", "108": "Brønsted–Lowry: a base is a proton acceptor. Proton donor is the acid; electron-pair acceptor is a Lewis acid.", "111": "KF is an ionic salt and dissociates completely: a strong electrolyte. (CH<sub>3</sub>)<sub>3</sub>N, HNO<sub>2</sub> and HF are weak electrolytes and water is a very weak one.", "114": "The equation writes OH<sup>−</sup> as free ions, so the base must be soluble and strong (e.g. NaOH, giving Na<sub>3</sub>PO<sub>4</sub>). Al(OH)<sub>3</sub> is insoluble and would be written as a solid, so the statement about Al(OH)<sub>3</sub> is false. H<sub>3</sub>PO<sub>4</sub> is a weak acid, written undissociated, and the reaction is a neutralization."};

var M={"exp": ["Historical-experiment questions", "Say what each experiment showed, then throw out options that belong to another model.", ["Learn the list: Thomson 1897 = electron (cathode rays); Millikan = charge of the electron; Rutherford 1910 (gold foil) = nucleus; Moseley = atomic number; Chadwick 1932 = neutron.", "Turn the observation into a conclusion: most particles pass through, so the atom is mostly empty space; a few bounce back, so there is a tiny, dense, positive centre.", "Cross out options that describe another model: electrons in circular orbits is Bohr, not Rutherford."]], "part": ["Which particle is it?", "This is a recall question on the three particles.", ["Proton: charge +1, mass about 1 amu, in the nucleus. Neutron: charge 0, mass about 1 amu, in the nucleus. Electron: charge −1, mass about 1/1836 amu, outside the nucleus.", "A neutral atom has as many electrons as protons. An ion is charged: cation = positive, anion = negative.", "Match the word in the question (positive, neutral, negative) to the particle."]], "sym": ["Write the symbol from protons, neutrons, electrons", "Always work in the same three steps.", ["Protons = Z. Look Z up on the periodic table to get the element.", "Mass number A = protons + neutrons (top left of the symbol).", "Charge = protons − electrons (top right). More protons than electrons means a positive ion.", "Check each option: wrong A (a common trap is writing Z as the mass number) or wrong charge kills it."]], "cmp": ["Compare species (isotopes, same neutrons, same mass number)", "Build a small table before reading the options.", ["For each species write Z (from the periodic table) and A (the number on the symbol).", "Neutrons N = A − Z.", "Same Z = isotopes (Whitten §4-7). Same A = isobars and same N = isotones (standard terms, not used in Whitten). Check which column is identical in your table.", "Electrons depend on the charge: neutral means electrons = Z."]], "nuc": ["Protons and neutrons from the symbol", "Two subtractions.", ["Protons = Z, the atomic number of the element (periodic table).", "Neutrons = A − Z, where A is the number written on the symbol.", "Electrons = Z for a neutral atom; adjust for the charge if it is an ion."]], "avg": ["Weighted average atomic mass", "Same method every time.", ["Turn percentages into fractions (26.0% = 0.260). If one abundance is missing, it is 100% minus the others.", "Average = (fraction₁ × mass₁) + (fraction₂ × mass₂) + …", "Sanity check: the answer must lie between the lightest and heaviest isotope, closer to the more abundant one.", "Round to the same decimals as the options."]], "rule": ["Name the principle or rule", "Memorise one keyword for each.", ["Pauli: no two electrons with the same four quantum numbers (max 2 per orbital).", "Hund: fill equal-energy orbitals one electron each before pairing.", "Aufbau: fill the lowest energy first.", "Heisenberg: cannot know position and momentum exactly at the same time.", "Find the keyword in the options."]], "qn": ["Quantum-number rules (allowed, not allowed, incorrect statement)", "Check the numbers in order n, l, m_l, m_s and stop at the first broken rule.", ["n = 1, 2, 3, … (whole numbers).", "l goes from 0 to n − 1 (0 = s, 1 = p, 2 = d, 3 = f).", "m_l goes from −l to +l, so there are 2l + 1 values.", "m_s is only +½ or −½.", "For an \"incorrect statement\" question, compare each option with these four lines."]], "qnorb": ["Quantum numbers of a named orbital (5d, 3p…)", "Read the name, then translate.", ["The number in front of the letter is n.", "The letter gives l: s = 0, p = 1, d = 2, f = 3.", "m_l can be any value from −l to +l, so every orbital of that subshell is a valid answer.", "Reject options with the wrong n, the wrong l, or an m_l outside the range."]], "cap": ["Orbital capacity and orbital shapes", "Two small tables to remember.", ["Orbitals per subshell = 2l + 1: s 1, p 3, d 5, f 7.", "Each orbital holds 2 electrons: s 2, p 6, d 10, f 14. A whole shell holds 2n².", "Shapes: every s orbital is spherical; p is dumbbell-shaped; d is mostly four-lobed.", "If the question gives l, get the letter first (l = 3 is f)."]], "last": ["Quantum numbers of the last electron of an element", "Write the configuration first, then read the last electron.", ["Write the configuration with the filling order 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p…", "The last electron sits in the last subshell written for that element; for a transition metal this is a d subshell of period − 1 (4d for period 5).", "n and l come from that subshell. Choose m_l inside −l…+l and m_s = ±½ (the first electrons in a subshell are usually given +½).", "Eliminate options with an impossible m_l, the wrong subshell (s instead of d) or the wrong n."]], "cfg": ["Write an electron configuration", "Count electrons, then fill in order.", ["Number of electrons = Z for a neutral atom. For an ion subtract the positive charge or add the negative one.", "Fill in this order: 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p. Capacities: s 2, p 6, d 10, f 14.", "Check that the exponents add up to the number of electrons.", "The short form starts from the previous noble gas ([Ar] for Z = 19–36, [Kr] for 37–54).", "For cations, take electrons from the highest n first (Na⁺ loses 3s; transition metals lose 4s before 3d). Exceptions to remember: Cr and Cu."]], "pos": ["Configuration → element, group and period", "Read the outer shell.", ["Period = the largest n in the configuration.", "For main-group elements, group = number of outer electrons in s and p (ns²np⁴ = 6 electrons = group VIA / 16).", "The outer configuration tells the block: s, p, d or f.", "Find the option that sits at that group and period on the periodic table."]], "grp": ["Classify elements on the periodic table", "Locate the element first.", ["Rows are periods, columns are groups. Group 1 alkali, group 2 alkaline earth, group 17 halogens, group 18 noble gases.", "Columns 3–12 are d-block (transition) metals.", "Metalloids sit on the staircase: B, Si, Ge, As, Sb, Te. Metals are to the left and bottom, nonmetals to the top right.", "Place every option on the table, then pick the one matching the property in the question."]], "trend": ["Periodic-trend questions (radius, ionization energy, electronegativity…)", "Locate the elements, then apply the arrows.", ["Atomic radius: increases going down a group and going left. Ionization energy and electronegativity: increase going up and going right.", "If two elements are in the same group compare by period; in the same period compare by group. If both differ, find which direction dominates, or compare with a third element.", "Known exceptions: IE of Be > B and N > O. A cation is smaller than its atom, an anion is larger.", "For \"which statement is wrong\" questions, test every option with these rules."]], "def": ["Match a process to its name", "Look at what happens to the electron.", ["Ionization energy: X(g) → X⁺(g) + e⁻ (an electron is removed; energy is needed).", "Electron affinity: X(g) + e⁻ → X⁻(g) (an electron is added).", "Electronegativity is the attraction of an atom for bonding electrons; it is not the energy of a process.", "Write the equation from the question and compare it with these."]], "ion": ["Predict a monoatomic ion", "Aim for the nearest noble gas.", ["Find the group of the element.", "Metals lose electrons: group 1 gives +1, group 2 gives +2, group 13 gives +3.", "Nonmetals gain electrons: group 17 gives −1, group 16 gives −2, group 15 gives −3.", "Check that the ion has the same number of electrons as a noble gas."]], "dat": ["Find a dative (coordinate) bond", "Draw the Lewis structure of each polyatomic ion.", ["Split the formula into the cation (Fe³⁺, Pb⁴⁺, which are simple ions) and the polyatomic anion (NO₃⁻, SO₃²⁻, NO₂⁻). Look for the dative bond inside the anion.", "Count valence electrons of the anion and draw single bonds with lone pairs to reach octets, adding charges.", "A dative bond is a covalent bond where one atom gives both electrons (drawn as an arrow, e.g. S→O or N→O). It appears where an atom with a lone pair shares it with an atom that needs electrons.", "Combine the results and choose the option that lists all the compounds with at least one such bond."]], "hyb": ["Hybridization of an atom", "Count electron domains around the atom.", ["Draw the Lewis structure.", "Domains = atoms bonded to the central atom + lone pairs on it. A double or triple bond counts as one domain.", "2 domains = sp (linear), 3 domains = sp² (trigonal planar), 4 domains = sp³ (tetrahedral).", "An atom with no choice (like the end atoms) is checked the same way: count what is around that atom."]], "lew": ["Bonds in a simple molecule", "Build the Lewis structure step by step.", ["Add up all valence electrons.", "Put the central atom (usually the unique or least electronegative one) in the middle and join the others with single bonds.", "Give every atom an octet (2 for H). If the central atom lacks one, turn lone pairs of the outer atoms into double bonds.", "Count the bonds you drew and read the answer."]]};

function rnd(n){return Math.floor(Math.random()*n)}
function pick(a){return a[rnd(a.length)]}
function shuf(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=rnd(k+1);var t=a[k];a[k]=a[j];a[j]=t}return a}
function samp(a,n){return shuf(a).slice(0,n)}
var MINUS='−';
function chg(q){if(q===0)return'';var m=Math.abs(q);return (m===1?'':m)+(q>0?'+':MINUS)}
var SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(n){return String(n).split('').map(function(c){return SUPD[c]}).join('')}
function nuc(A,Z,q){return '<sup>'+A+'</sup>'+SYM[Z]+(q?'<sup>'+chg(q)+'</sup>':'')}
function ion(Z,q){return SYM[Z]+(q?'<sup>'+chg(q)+'</sup>':'')}

}

var ORDER=[['1s',1,0],['2s',2,0],['2p',2,1],['3s',3,0],['3p',3,1],['4s',4,0],['3d',3,2],['4p',4,1],['5s',5,0],['4d',4,2],['5p',5,1]];
function capOf(k){for(var i=0;i<ORDER.length;i++)if(ORDER[i][0]===k)return 2*(2*ORDER[i][2]+1)}
function baseCfg(Z){var c={},left=Z;ORDER.forEach(function(o){c[o[0]]=0});
  for(var i=0;i<ORDER.length&&left>0;i++){var t=Math.min(capOf(ORDER[i][0]),left);c[ORDER[i][0]]=t;left-=t}
  if(Z===24){c['4s']=1;c['3d']=5}if(Z===29){c['4s']=1;c['3d']=10}return c}
function cp(c){var d={};for(var k in c)d[k]=c[k];return d}
function tot(c){var s=0;for(var k in c)s+=c[k];return s}
function cfgStr(c){var skip={},core='';
  var kr=['1s','2s','2p','3s','3p','4s','3d','4p'],ar=['1s','2s','2p','3s','3p'];
  function full(l){return l.every(function(k){return c[k]===capOf(k)})}
  if(tot(c)>=19){if(tot(c)>36&&full(kr)){core='[Kr]';kr.forEach(function(k){skip[k]=1})}else if(full(ar)){core='[Ar]';ar.forEach(function(k){skip[k]=1})}}
  var p=[];ORDER.forEach(function(o){var k=o[0];if(!skip[k]&&c[k]>0)p.push(k+sup(c[k]))});
  return ((core?core+' ':'')+p.join(' ')).trim()}
function outerFirst(){return ORDER.slice().sort(function(a,b){return b[1]-a[1]||b[2]-a[2]})}
function removeEl(c,q,order){var d=cp(c);order=order||outerFirst();
  while(q>0){var done=false;for(var i=0;i<order.length;i++){var k=order[i][0];if(d[k]>0){d[k]--;done=true;break}}if(!done)break;q--}return d}
function addEl(c,q){var d=cp(c);while(q>0){for(var i=0;i<ORDER.length;i++){var k=ORDER[i][0];if(d[k]<capOf(k)){d[k]++;break}}q--}return d}
function lastOcc(c){var r=null;ORDER.forEach(function(o){if(c[o[0]]>0)r=o[0]});return r}
function cfgWrong(c,correctStr,extra){
  var pool=[],k;
  var L=lastOcc(c);
  if(c[L]<capOf(L)){var d=cp(c);d[L]++;pool.push(cfgStr(d))}
  if(c[L]>0){var d2=cp(c);d2[L]--;pool.push(cfgStr(d2))}
  [['4s','3d'],['3d','4s'],['3s','3p'],['2s','2p'],['4s','4p'],['3p','4s'],['2p','3s']].forEach(function(pr){
    if(c[pr[0]]>0&&c[pr[1]]<capOf(pr[1])){var d3=cp(c);d3[pr[0]]--;d3[pr[1]]++;pool.push(cfgStr(d3))}});
  if(extra)extra.forEach(function(x){pool.push(x)});
  var s=correctStr;
  if(s.indexOf('[Ar]')===0)pool.push(s.replace('[Ar]','[Kr]'),s.replace('[Ar]','[Ne]'));
  ORDER.forEach(function(o){var k=o[0];if(c[k]>0){var a=cp(c);a[k]--;pool.push(cfgStr(a));if(c[k]<capOf(k)){var b=cp(c);b[k]++;pool.push(cfgStr(b))}}});
  var out=[],seen={};seen[correctStr]=1;
  shuf(pool).forEach(function(x){if(!seen[x]&&out.length<4){seen[x]=1;out.push(x)}});
  return out}
function unpaired(c){var u=0;ORDER.forEach(function(o){var n=c[o[0]],orb=2*o[2]+1;if(n>0)u+=(n<=orb?n:2*orb-n)});return u}

function r2(v){var x=Math.round(v*100)/100;return x===0?0:x}
function vs(v){var x=r2(v);return (x<0?MINUS:'')+Math.abs(x).toFixed(2)+' V'}
function ehint(ks){return '(E°: '+ks.map(function(k){return EP[k][0]+'/'+k+' = '+(EP[k][2]<0?MINUS:'+')+Math.abs(EP[k][2]).toFixed(2)+' V'}).join('; ')+')'}
function tenp(c){if(c>=1)return c.toFixed(1);var e=Math.round(-Math.log10(c));return '10<sup>'+MINUS+e+'</sup>'}

function lcm(a,b){return a*b/gcd(a,b)}

function pairCathAn(){var ks=samp(Object.keys(EP),2),a=ks[0],b=ks[1];if(EP[a][2]<EP[b][2]){var t=a;a=b;b=t}return {c:a,a:b}}

var TT={
hist:['Atomic theory and the particles',
'<p><b>Dalton (1808)</b> started modern atomic theory: matter is made of atoms; atoms of one element are identical and differ from those of other elements; compounds form from fixed whole-number ratios of atoms (Law of Definite Proportions); in a reaction atoms are rearranged, never created or destroyed.</p><p><b>Thomson (1897)</b> studied cathode rays and showed that they are streams of negative particles, the electrons, present in every element (e/m = 1.75882×10⁸ C/g). <b>Millikan</b> later measured the charge of one electron, 1.60218×10⁻¹⁹ C, which gives its mass: 9.109×10⁻²⁸ g, about 1/1836 of a hydrogen atom. Thomson pictured the atom as positive matter with electrons embedded in it (plum pudding).</p><p><b>Rutherford (1910)</b> fired alpha particles at a gold foil. Nearly all went straight through, a few were deflected and about 0.001% bounced back. That is only possible if the positive charge and almost all the mass are packed in a tiny <b>nucleus</b> (about 1/10,000 of the atom’s diameter), with the rest of the atom mostly empty space where the electrons are. <b>Moseley (1913)</b> showed that each element is defined by its atomic number, and <b>Chadwick (1932)</b> discovered the neutron.</p><p><b>The three particles.</b> Proton: charge +1, 1.0073 amu. Neutron: charge 0, 1.0087 amu. Electron: charge −1, 0.00054858 amu. Protons and neutrons are in the nucleus. Questions on this topic are recall: pair each discovery with its scientist, and turn an observation into the right conclusion while rejecting options that belong to other models (circular orbits are Bohr, not Rutherford).</p>'],
comp:['Atomic composition: Z, A, ions and isotopes',
'<p>Every atom is identified by its <b>atomic number Z</b>, the number of protons. The <b>mass number A</b> is protons plus neutrons, so neutrons = A − Z. A neutral atom has as many electrons as protons; an ion has gained or lost electrons and its charge is protons − electrons. The full symbol puts A at the top left, Z at the bottom left and the charge at the top right: <sup>50</sup>Cr<sup>2+</sup> has 24 protons, 26 neutrons and 22 electrons.</p><p><b>Isotopes</b> have the same Z and different A (same element, different number of neutrons: <sup>35</sup>Cl and <sup>37</sup>Cl). <b>Isobars</b> have the same A and different Z (<sup>40</sup>Ar and <sup>40</sup>K). <b>Isotones</b> have the same number of neutrons (<sup>72</sup>Zn, <sup>75</sup>As and <sup>74</sup>Ge all have 42). When a question compares species, compute Z, A and N for each in a small table: the relationship asked about is the quantity that is identical.</p><p>Typical traps: writing Z where A is needed, forgetting that a charge changes only the electrons (never the protons or neutrons), and getting the sign wrong (a cation has fewer electrons than protons). The atomic mass unit is 1/12 of the mass of one <sup>12</sup>C atom (1.66054×10⁻²⁴ g).</p>'],
avg:['Weighted average atomic mass',
'<p>Most elements exist as a mixture of isotopes, so the atomic mass shown on the periodic table is a <b>weighted average</b> of the isotope masses, weighted by their natural abundance. Convert each percentage into a fraction, multiply by the mass of that isotope and add: average = Σ (fraction × mass). If one abundance is missing it is 100% minus the others.</p><p>The result must lie between the lightest and heaviest isotope and closer to the more abundant one, a quick plausibility check. The simple (unweighted) mean is the typical wrong option, together with the version where the two abundances are swapped. Example: 26.0% of 64.23 amu and 74.0% of 65.32 amu gives 0.260×64.23 + 0.740×65.32 = 65.04 ≈ 65.0 amu. With exact isotope masses magnesium gives 24.305 u (the lecture value 24.04 was an error).</p>'],
qn:['Quantum numbers, orbitals and the four principles',
'<p>The behaviour of an electron in an atom is described by four <b>quantum numbers</b>. The principal number <b>n</b> (1, 2, 3, …) gives the shell, its size and its energy. The angular-momentum number <b>l</b> runs from 0 to n − 1 and gives the subshell and the orbital shape: l = 0 is s (spherical), 1 is p (dumbbell), 2 is d, 3 is f. The magnetic number <b>m<sub>l</sub></b> runs from −l to +l and labels the orientation of each orbital, so a subshell has 2l + 1 orbitals: 1 (s), 3 (p), 5 (d), 7 (f). The spin number <b>m<sub>s</sub></b> is +½ or −½.</p><p>An orbital name is just a code: 4d means n = 4 and l = 2, with any m<sub>l</sub> from −2 to +2. Names like 1p, 2d or 3f do not exist because l must be smaller than n. A shell contains n² orbitals and holds 2n² electrons; a subshell holds 2(2l + 1): s 2, p 6, d 10, f 14. To test a set of numbers, check them in order n, l, m<sub>l</sub>, m<sub>s</sub> and stop at the first rule that is broken.</p><p>Four principles frame the topic. <b>Pauli</b>: no two electrons in an atom share the same four quantum numbers, so an orbital holds at most two electrons with opposite spins. <b>Hund</b>: orbitals of equal energy are filled singly, with parallel spins, before any pairing. <b>Aufbau</b>: electrons occupy the lowest-energy subshell available first. <b>Heisenberg</b>: position and momentum of an electron cannot both be known exactly, which is why orbitals are probability regions and not orbits.</p>'],
cfg:['Electron configurations, ions and position in the table',
'<p>The <b>electron configuration</b> says how many electrons are in each subshell. For a neutral atom the number of electrons is Z. Electrons fill the subshells in order of increasing energy (the (n + l) rule of Whitten §4-18: fill in order of increasing n + l; if n + l is equal, the subshell with lower n first): 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p. Capacities are s 2, p 6, d 10, f 14, and the exponents must add up to the number of electrons. The short form starts from the previous noble gas: nickel is [Ar] 4s² 3d⁸.</p><p><b>Hund’s rule</b> decides how electrons spread inside a subshell: one in each orbital first, then pairs. This gives the number of unpaired electrons (p³ has 3, p⁴ has 2, d⁵ has 5, a full subshell has none). The two classic exceptions are <b>chromium</b> ([Ar] 4s¹ 3d⁵) and <b>copper</b> ([Ar] 4s¹ 3d¹⁰), where a half-filled or filled d subshell is more stable.</p><p><b>Ions.</b> Start from the neutral configuration and remove or add electrons, taking them away from the outermost shell, that is the highest n: Na<sup>+</sup> loses its 3s electron and becomes 1s² 2s² 2p⁶; Fe<sup>2+</sup> loses the two 4s electrons first and is [Ar] 3d⁶. Anions fill up to the next noble gas (Cl<sup>−</sup> = [Ar]).</p><p><b>Position in the table.</b> The period is the highest n. For main-group elements the group is given by the number of outer s and p electrons (ns²np⁴ means six outer electrons: group 16, VIA). The last electron of a transition metal goes into a d subshell of the shell n − 1 (Mo: 4d). The blocks s, p, d, f are named after the subshell being filled.</p>'],
per:['The periodic table, trends and ions',
'<p>The periodic table is organised by electron configuration. Rows are <b>periods</b> (highest n) and columns are <b>groups</b> (same number of outer electrons). Group 1 are the alkali metals, group 2 the alkaline earth metals, groups 3–12 the d-block (transition) metals, group 17 the halogens and group 18 the noble gases. Metals are on the left and in the centre, nonmetals in the upper right, and the metalloids (B, Si, Ge, As, Sb, Te) lie on the staircase between them.</p><p><b>Trends</b> come from two competing effects: the number of shells (distance) and the nuclear charge. Down a group, new shells make the atom bigger: <b>atomic radius increases</b> while <b>ionization energy, electron affinity and electronegativity decrease</b>. Across a period the nuclear charge grows while the shell stays the same, so the radius shrinks and the ionization energy and electronegativity increase. That is why fluorine is the most electronegative element (4.0), francium among the least (0.8), and the noble gases have the highest ionization energies of their period. Known dips: first ionization energy of Be is higher than that of B, and N is higher than O. A cation is smaller than its atom, an anion is larger.</p><p><b>Definitions.</b> Ionization energy is the energy needed to remove an electron from a gaseous atom, X(g) → X<sup>+</sup>(g) + e<sup>−</sup>. Electron affinity is the energy change when a gaseous atom gains an electron. Electronegativity is the tendency of an atom in a bond to attract the shared electrons; it is not the energy of a process. Successive ionization energies always increase (IE<sub>1</sub> &lt; IE<sub>2</sub> &lt; IE<sub>3</sub>) and show a huge jump when the first core electron is removed: Be jumps after IE<sub>2</sub>, Al after IE<sub>3</sub>. This is how the number of valence electrons is read from data.</p><p><b>Ions.</b> Atoms tend to reach a noble-gas configuration: group 1 gives +1, group 2 gives 2+, group 13 gives 3+, group 17 gives −1, group 16 gives 2−, group 15 gives 3−.</p>'],
bond:['Chemical bonds, Lewis structures and hybridization',
'<p>Atoms bond to lower their energy, usually by reaching eight outer electrons (the <b>octet rule</b>; two for hydrogen). Valence electrons are drawn as dots in a <b>Lewis structure</b>. In an <b>ionic</b> bond electrons are transferred from a metal to a nonmetal and the ions are held together by electrostatic attraction in a lattice (Na<sup>+</sup>Cl<sup>−</sup>). In a <b>covalent</b> bond a pair is shared, and the shared pairs can be one, two or three (single, double, triple bond). If the two atoms differ in electronegativity the pair is shared unequally (polar covalent bond, a dipole). In a <b>dative</b> (coordinate) bond both electrons of the shared pair come from the same atom. In <b>metals</b> the valence electrons form a delocalised sea.</p><p>To draw a Lewis structure: add up all the valence electrons (adjusting for the charge), join the atoms with single bonds with the central atom in the middle, complete the octets of the outer atoms, and if the central atom still lacks an octet turn lone pairs into double or triple bonds. CO<sub>2</sub> is O=C=O (two double bonds), N<sub>2</sub> has a triple bond, HCN is H–C≡N. In polyatomic ions such as nitrate or sulfite, the dative bond is the one in which a single atom has to supply both electrons.</p><p><b>Hybridization (valence-bond theory).</b> To explain molecular geometry, the atomic orbitals of the central atom mix into equivalent hybrid orbitals. Count the <b>electron domains</b> around the central atom: each bonded atom counts one (single, double or triple bond alike) and each lone pair counts one. Two domains give sp (linear, 180°), three give sp² (trigonal planar, about 120°), four give sp³ (tetrahedral, about 109°). SO<sub>2</sub> has two bonded atoms plus one lone pair, so sp²; HCN has two domains on carbon and on nitrogen, so both are sp; H<sub>2</sub>CO<sub>3</sub> has carbon with three domains, so sp².</p>']
};

TT.mol=['The mole, molar mass and stoichiometry','<p>Atoms are far too small to count, so chemists count them in bundles called <b>moles</b>. One <b>mole</b> is the amount of substance containing 6.022×10²³ entities (Avogadro’s number N<sub>A</sub>), chosen so that the <b>molar mass</b> in g/mol of any substance is numerically equal to its formula mass in amu. The molar mass of a compound is the sum of the atomic masses of its atoms, each multiplied by its subscript. This single idea lets you move between three worlds: mass (what the balance shows), moles (the chemical amount) and number of particles (atoms, molecules, ions).</p><p>The conversion chain is grams → moles (divide by molar mass) → particles (multiply by N<sub>A</sub>), and the reverse. For the atoms of one element inside a compound, multiply by the number of those atoms per formula unit. <b>Mass percent</b> of an element is the mass of that element in one mole of compound divided by the molar mass. If you are given percentages instead, assume 100 g of compound so that percent becomes grams, convert each to moles and divide by the smallest to obtain the <b>empirical formula</b> (the simplest whole-number ratio); the molecular formula is a whole multiple of it.</p><p><b>Stoichiometry</b> uses the balanced equation, whose coefficients are mole ratios. To find the mass of product from a mass of reactant: grams of reactant → moles → (coefficient ratio) → moles of product → grams. When two reactants are given, the one that gives less product is the <b>limiting reagent</b>; the other is in excess. Typical mistakes: using an unbalanced equation, forgetting subscripts in the molar mass, and mixing grams with moles in the ratio.</p>'];
TT.gas=['Gases and the gas laws','<p>A gas has no fixed shape or volume and fills its container. Its state is described by pressure P, volume V, temperature T (always in kelvin, K = °C + 273.15) and amount n. The empirical laws are <b>Boyle</b> (P·V constant at constant n and T: pressure and volume are inversely proportional), <b>Charles</b> (V/T constant at constant n and P) and <b>Avogadro</b> (equal volumes of gas at the same T and P contain equal numbers of molecules). Combined, they give the <b>ideal gas law PV = nRT</b>, with R = 0.0821 L·atm/(mol·K).</p><p>From PV = nRT with n = m/M you get the density d = PM/RT and the molar mass M = dRT/P. The molar volume is RT/P, equal to 22.4 L only at STP (0 °C, 1 atm). For a mixture, <b>Dalton’s law</b> says the total pressure is the sum of the partial pressures, and each partial pressure is the mole fraction times the total pressure: P<sub>i</sub> = x<sub>i</sub>P<sub>tot</sub>.</p><p>The ideal gas is a model: point-like molecules with no attractions. Real gases behave ideally at <b>low pressure and high temperature</b>, when the molecules are far apart and fast. Common mistakes: using °C instead of K, using R with the wrong units, and thinking that density is independent of pressure.</p>'];
TT.sol=['Solutions, concentration and colligative properties','<p>A solution is a homogeneous mixture of a <b>solute</b> in a <b>solvent</b>. Concentration can be expressed as <b>molarity</b> M (mol solute per litre of solution), <b>molality</b> m (mol solute per kg of solvent), <b>mole fraction</b> x (moles of component over total moles) and <b>normality</b> N (equivalents per litre, M times the equivalents per mole). Molality does not change with temperature because it uses mass. To dilute, the moles of solute stay constant: M<sub>1</sub>V<sub>1</sub> = M<sub>2</sub>V<sub>2</sub>.</p><p><b>Colligative properties</b> depend on the number of dissolved particles, not on their identity: vapor-pressure lowering (Raoult: P = x<sub>solvent</sub>P°), boiling-point elevation ΔT<sub>eb</sub> = K<sub>eb</sub>·m·i, freezing-point depression ΔT<sub>f</sub> = K<sub>f</sub>·m·i and osmotic pressure π = MRTi. The <b>van’t Hoff factor i</b> counts the particles per formula unit: 1 for glucose and sucrose, 2 for NaCl, 3 for CaCl<sub>2</sub>, 5 for Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> (ideal case).</p><p>The solution boils above and freezes below the pure solvent, so you add ΔT<sub>eb</sub> to 100 °C and subtract ΔT<sub>f</sub> from 0 °C. Osmosis is the flow of solvent through a semipermeable membrane towards the more concentrated solution. Mistakes to avoid: forgetting i, using volume instead of kg of solvent, and using °C for π.</p>'];
TT.eq=['Chemical equilibrium and Le Chatelier','<p>A reversible reaction reaches <b>equilibrium</b> when the forward and backward rates are equal; concentrations then stay constant (a dynamic state). The <b>equilibrium constant</b> K is the ratio of products to reactants, each raised to its stoichiometric coefficient. K<sub>c</sub> uses concentrations, K<sub>p</sub> partial pressures. Pure solids and liquids do not appear. The two are linked by K<sub>p</sub> = K<sub>c</sub>(RT)<sup>Δn</sup>, where Δn is the change in gas moles (products minus reactants); if Δn = 0 they are equal. K depends only on temperature.</p><p>The <b>reaction quotient Q</b> has the same form as K but uses the concentrations at any moment. If Q < K the reaction proceeds to the right, if Q > K to the left, if Q = K the system is at equilibrium. <b>Le Chatelier’s principle</b>: a system at equilibrium that is disturbed shifts to oppose the disturbance. Adding a reactant shifts right; removing a product shifts right; increasing pressure favours the side with fewer gas moles; heating favours the endothermic direction. A <b>catalyst</b> speeds up both directions equally and leaves the position and K unchanged. Only a temperature change alters K.</p>'];
TT.kps=['Solubility equilibria (K<sub>ps</sub>)','<p>For a sparingly soluble salt, the dissolved ions are in equilibrium with the solid. The <b>solubility product</b> K<sub>ps</sub> is the product of the ion concentrations raised to their coefficients (the solid is left out). If the solubility is S (mol/L), then for MX K<sub>ps</sub> = S², for MX<sub>2</sub> K<sub>ps</sub> = S·(2S)² = 4S³, and for M<sub>2</sub>X<sub>3</sub> K<sub>ps</sub> = (2S)²(3S)³ = 108S⁵.</p><p>To predict precipitation compute the ion product Q with the actual concentrations: Q > K<sub>ps</sub> means precipitation, Q < K<sub>ps</sub> an unsaturated solution. The <b>common-ion effect</b>: adding a soluble compound with an ion in common with the salt lowers its solubility (Le Chatelier). Solubility values can be compared directly only for salts with the same formula type.</p>'];
TT.ab=['Acids, bases, pH, buffers and titrations','<p>In the Brønsted–Lowry theory an acid donates H<sup>+</sup> and a base accepts it; an acid and the base left after donation are a <b>conjugate pair</b>. Strong acids (HCl, HBr, HI, HNO<sub>3</sub>, HClO<sub>4</sub>, first H of H<sub>2</sub>SO<sub>4</sub>) and strong bases (group 1 and heavy group 2 hydroxides) dissociate completely. pH = −log[H<sup>+</sup>], pOH = −log[OH<sup>−</sup>], pH + pOH = 14 at 25 °C. For a weak acid, [H<sup>+</sup>] ≈ √(K<sub>a</sub>C); for conjugates K<sub>a</sub>K<sub>b</sub> = K<sub>w</sub> = 10<sup>−14</sup>.</p><p><b>Hydrolysis</b>: the ion of a weak acid or base reacts with water. A salt of weak acid + strong base gives a basic solution; strong acid + weak base acidic; strong + strong neutral. A <b>buffer</b> is a weak acid with its conjugate base (or the reverse): it resists pH changes, and its pH follows Henderson–Hasselbalch, pH = pK<sub>a</sub> + log([base]/[acid]). In a <b>neutralization</b> the equivalents of acid equal those of base. Each pH unit corresponds to a factor 10 in [H<sup>+</sup>], which governs dilution questions.</p>'];
TT.nom=['Nomenclature and basic reactions','<p>Ionic compounds are named cation + anion. Metals with several oxidation numbers carry a Roman numeral (iron(III) chloride). Anions: simple ones end in <b>-ide</b>; oxyanions end in <b>-ate</b> (more oxygen) or <b>-ite</b> (less), with <b>hypo-</b> (fewest) and <b>per-</b> (most) at the extremes (hypochlorite ClO<sup>−</sup>, chlorite, chlorate, perchlorate). Acids come from them: -ate → -ic acid, -ite → -ous acid, binary acids are hydrogen ...ide. Molecular oxides use prefixes (dinitrogen tetroxide).</p><p>Reaction patterns: metal oxide + water → hydroxide (base); nonmetal oxide + water → acid; acid + hydroxide → salt + water. To write a salt, cross the charges of cation and anion and simplify. Balance by counting each element on both sides.</p>'];
TT.red=['Oxidation numbers and redox','<p>The <b>oxidation number</b> is the charge an atom would have if the electrons of each bond went to the more electronegative atom. Rules: elements = 0; the sum equals the charge of the species; O is −2 (−1 in peroxides), H +1, group 1 +1, group 2 +2, F −1, other halogens −1 in halides. In a redox reaction the species whose number increases is <b>oxidized</b> (loses electrons) and is the <b>reducing agent</b>; the one whose number decreases is <b>reduced</b> and is the <b>oxidizing agent</b>.</p><p>Balancing equations: count atoms of each element on both sides, starting from the most complex species and leaving H and O for last; for redox equations also balance charge/electrons.</p>'];
TT.org=['Organic chemistry: names, groups, isomers, reactions','<p>Organic compounds are built on carbon chains. <b>Alkanes</b> C<sub>n</sub>H<sub>2n+2</sub> have single bonds, <b>alkenes</b> C<sub>n</sub>H<sub>2n</sub> a double bond, <b>alkynes</b> C<sub>n</sub>H<sub>2n−2</sub> a triple bond. IUPAC naming: choose the longest chain containing the multiple bond, number it so the multiple bond (or first branch) gets the lowest number, name the branches (methyl, ethyl, chloro) with their positions. <b>Functional groups</b>: alcohol -OH, aldehyde -CHO, ketone C=O, carboxylic acid -COOH, ester -COO-, amine -NH<sub>2</sub>, amide -CONH<sub>2</sub>, halide -X, ether C-O-C.</p><p><b>Isomers</b> share the formula but differ in structure; <b>cis-trans (E/Z) isomerism</b> needs a double bond with two different groups on each carbon. Reaction types: <b>substitution</b> (group replaced), <b>addition</b> (double bond opened) and <b>elimination</b> (small molecule removed, double bond formed).</p>'];
TT.el=['Electrochemistry','<p>In a <b>galvanic cell</b> a spontaneous redox reaction produces current: oxidation at the <b>anode</b>, reduction at the <b>cathode</b>. E°<sub>cell</sub> = E°<sub>cathode</sub> − E°<sub>anode</sub> (reduction potentials, never multiplied by coefficients); E° > 0 means spontaneous. The <b>Nernst equation</b> E = E° − (0.0592/n) log Q at 25 °C gives the potential under non-standard conditions. In <b>electrolysis</b> Faraday’s law links charge and moles: Q = I·t, mol e<sup>−</sup> = Q/96485.</p>'];

TT.kin=['Chemical kinetics (Whitten ch. 16)','<p><b>Chemical kinetics</b> studies how fast reactions go. The <b>rate of a reaction</b> is the change in concentration of a reactant or product per unit time (units M/s). The <b>rate-law expression</b> relates the rate to the concentrations: rate = <i>k</i>[A]<sup>x</sup>[B]<sup>y</sup>. The constant <i>k</i> is the <b>rate constant</b> at a given temperature, and the exponents x and y are the <b>orders</b> with respect to each reactant; their sum is the overall order. The orders are found by experiment and bear no necessary relationship to the coefficients of the balanced equation. With the <b>method of initial rates</b> you change one concentration at a time and compare the initial rates: if doubling [A] doubles the rate the order in A is 1, if it quadruples the rate the order is 2, if the rate does not change the order is 0. The units of <i>k</i> depend on the overall order: M s<sup>−1</sup> (zero), s<sup>−1</sup> (first), M<sup>−1</sup> s<sup>−1</sup> (second).</p><p>The rate law gives the rate from the concentrations; the <b>integrated rate equation</b> gives concentration as a function of time (Whitten Table 16-2, for aA → products with a = 1): zero order [A] = [A]<sub>0</sub> − <i>kt</i>, half-life [A]<sub>0</sub>/2<i>k</i>; first order ln([A]<sub>0</sub>/[A]) = <i>kt</i>, half-life 0.693/<i>k</i>; second order 1/[A] − 1/[A]<sub>0</sub> = <i>kt</i>, half-life 1/<i>k</i>[A]<sub>0</sub>. The <b>half-life</b> t<sub>1/2</sub> is the time for the concentration to fall to half. Only for a first-order reaction does it not depend on the initial concentration. Each plot is a straight line for one order: [A] versus t (zero), ln[A] versus t (first), 1/[A] versus t (second).</p><p><b>Temperature and catalysts.</b> The <b>Arrhenius equation</b> k = Ae<sup>−E<sub>a</sub>/RT</sup>, or ln <i>k</i> = ln A − E<sub>a</sub>/RT, shows that <i>k</i> grows with temperature and that the greater the <b>activation energy</b> E<sub>a</sub> the smaller <i>k</i>. A plot of ln <i>k</i> versus 1/T is a line of slope −E<sub>a</sub>/R. Subtracting the equation at two temperatures gives ln(<i>k</i><sub>2</sub>/<i>k</i><sub>1</sub>) = (E<sub>a</sub>/R)(1/T<sub>1</sub> − 1/T<sub>2</sub>), with T in kelvin, R = 8.314 J/(mol·K) and E<sub>a</sub> in J/mol. A <b>catalyst</b> speeds up a reaction by providing an alternative pathway with a lower activation energy; it takes part in the steps but is regenerated.</p>'];

var SKN=SEC2.KIN,KR='Generated from Whitten ch. 16 (the course materials contain no exam question on this chapter)';
function kusp(n){return n===0?'M s<sup>−1</sup>':n===1?'s<sup>−1</sup>':n===2?'M<sup>−1</sup> s<sup>−1</sup>':'M<sup>−2</sup> s<sup>−1</sup>'}
function rlaw(x,y){var s='rate = <i>k</i>';if(x)s+='[A]'+(x>1?'<sup>'+x+'</sup>':'');if(y)s+='[B]'+(y>1?'<sup>'+y+'</sup>':'');return s}
reg(SKN,3,function(){
  var x=pick([1,1,2,0]),y=pick([1,2,0,1]);if(x+y===0)return null;
  var k=pick([0.5,2.5,0.12,1.2e-2,3.6e-3,4.5,0.08]),a=pick([0.1,0.2,0.5,1.0,0.05]),b=pick([0.1,0.3,0.4,0.8,0.02]);
  var r=k*Math.pow(a,x)*Math.pow(b,y);
  return nm(SKN,'krate','For the reaction A + B → products the experimental rate law is '+rlaw(x,y)+', with <i>k</i> = '+fmt(k)+' '+kusp(x+y)+'. What is the rate when [A] = '+fmt(a)+' M and [B] = '+fmt(b)+' M?',r,
   [k*(a+b),k*a*b,k*Math.pow(a,y)*Math.pow(b,x),k*Math.pow(a,x+y)],
   'The rate law gives the rate directly from the concentrations: '+rlaw(x,y)+' = '+fmt(k)+(x?' × ('+fmt(a)+')'+(x>1?'<sup>'+x+'</sup>':''):'')+(y?' × ('+fmt(b)+')'+(y>1?'<sup>'+y+'</sup>':''):'')+' = '+fmt(r)+' M/s. The exponents are found by experiment; they are not the coefficients of the balanced equation, and a reactant with exponent 0 does not change the rate.',' M/s',KR);
});
reg(SKN,3,function(){
  var x=pick([0,1,2]),y=pick([0,1,2]);if(x+y===0)return null;
  var fb=pick([2,3]),k=pick([0.5,1.5,2.0,0.25]),A0=pick([0.10,0.20,0.05]),B0=pick([0.10,0.20,0.05]);
  var r1=k*Math.pow(A0,x)*Math.pow(B0,y),r2=k*Math.pow(A0*2,x)*Math.pow(B0,y),r3=k*Math.pow(A0,x)*Math.pow(B0*fb,y);
  var rows=[[A0,B0,r1],[A0*2,B0,r2],[A0,B0*fb,r3]];
  var tbl=rows.map(function(r,i){return 'Exp. '+(i+1)+': [A] = '+fmt(r[0])+' M, [B] = '+fmt(r[1])+' M, initial rate = '+fmt(r[2])+' M/s'}).join('<br>');
  var wrong=[];for(var i=0;i<3;i++)for(var j=0;j<3;j++){if(!(i===x&&j===y))wrong.push(rlaw(i,j))}
  return mk(SKN,'kinit','The initial rates of the reaction A + B → products were measured at the same temperature:<br>'+tbl+'<br>What is the rate law?',rlaw(x,y),wrong,
   'Method of initial rates: change one concentration at a time. From Exp. 1 to Exp. 2 only [A] changes (×2) and the rate changes by a factor '+fmt(r2/r1)+' = 2<sup>'+x+'</sup>, so the order in A is '+x+'. From Exp. 1 to Exp. 3 only [B] changes (×'+fb+') and the rate changes by a factor '+fmt(r3/r1)+' = '+fb+'<sup>'+y+'</sup>, so the order in B is '+y+'. Rate law: '+rlaw(x,y)+'. (An unchanged rate means order 0.)',KR);
});
reg(SKN,3,function(){
  var k=pick([2.3e-3,5.0e-4,1.2e-2,3.5e-2,8.0e-3,1.5e-4]),A0=pick([0.50,0.80,1.0,0.20,0.10,2.0]);
  if(Math.random()<.5){
    var t=Math.round(pick([0.4,0.8,1.2,1.6,2.2])/k/10)*10;if(t<=0)return null;var A=A0*Math.exp(-k*t);
    return nm(SKN,'kfirst','The reaction A → products is first order in A with <i>k</i> = '+fmt(k)+' s<sup>−1</sup>. If [A]<sub>0</sub> = '+fmt(A0)+' M, what is [A] after '+t+' s?',A,
     [A0*Math.exp(k*t),A0/(1+k*t),A0-k*t,A0*Math.exp(-k*t/2)],
     'First order (Whitten Table 16-2): ln([A]<sub>0</sub>/[A]) = <i>kt</i>, so [A] = [A]<sub>0</sub>e<sup>−<i>kt</i></sup>. Here <i>kt</i> = '+fmt(k)+' × '+t+' = '+fmt(k*t)+', so [A] = '+fmt(A0)+' × e<sup>−'+fmt(k*t)+'</sup> = '+fmt(A)+' M. (A first-order concentration falls exponentially, never linearly.)',' M',KR);
  }
  var f=pick([0.5,0.25,0.2,0.1,0.05,0.8]),tt=Math.log(1/f)/k;
  return nm(SKN,'kfirst','The reaction A → products is first order in A with <i>k</i> = '+fmt(k)+' s<sup>−1</sup>. How long does it take for [A] to fall to '+Math.round(f*100)+'% of its initial value?',tt,
   [Math.log10(1/f)/k,(1-f)/k,1/(k*f),Math.log(1/f)/(2*k)],
   'ln([A]<sub>0</sub>/[A]) = <i>kt</i> with [A]/[A]<sub>0</sub> = '+f+': <i>t</i> = ln('+fmt(1/f)+')/'+fmt(k)+' s<sup>−1</sup> = '+fmt(Math.log(1/f))+' / '+fmt(k)+' = '+fmt(tt)+' s. (Use the natural logarithm, not log<sub>10</sub>.)',' s',KR);
});

reg(SKN,2,function(){

  if(Math.random()<.6){
    var fr=pick([0.2,0.5,0.7]),t=Math.round(fr*A0/k/10)*10;if(t<=0)return null;var A=A0-k*t;if(A<=0)return null;

     [A0*Math.exp(-k*t),A0/(1+k*A0*t),A0-k*t*A0,A0+k*t],

   'For zero order t<sub>1/2</sub> = [A]<sub>0</sub>/(2<i>k</i>) (Whitten Table 16-2) = '+fmt(A0)+' / (2 × '+fmt(k)+') = '+fmt(h)+' s.',' s',KR);

reg(SKN,3,function(){
  var Rg=8.314,T1=pick([298,300,310]),T2=T1+pick([10,20,25,40]),Ea=pick([40,50,60,75,90]),k1=pick([1.2e-3,4.5e-4,2.0e-2,6.0e-3]);
  var k2=k1*Math.exp(Ea*1000/Rg*(1/T1-1/T2));
  if(Math.random()<.5){
    return nm(SKN,'karr','A reaction has activation energy E<sub>a</sub> = '+Ea+' kJ/mol. Its rate constant is '+fmt(k1)+' s<sup>−1</sup> at '+T1+' K. What is the rate constant at '+T2+' K? (R = 8.314 J/mol·K)',k2,
     [k1*T2/T1,k1*Math.exp(-Ea*1000/Rg*(1/T1-1/T2)),k1*Math.exp(Ea/Rg*(1/T1-1/T2)),k1*Math.exp(Ea*1000/Rg*(T2-T1))],
     'Subtracting the Arrhenius equations ln <i>k</i> = ln A − E<sub>a</sub>/RT at the two temperatures gives ln(<i>k</i><sub>2</sub>/<i>k</i><sub>1</sub>) = (E<sub>a</sub>/R)(1/T<sub>1</sub> − 1/T<sub>2</sub>). With E<sub>a</sub> in J/mol: = ('+(Ea*1000)+'/8.314) × (1/'+T1+' − 1/'+T2+') = '+fmt(Math.log(k2/k1))+', so <i>k</i><sub>2</sub> = '+fmt(k1)+' × e<sup>'+fmt(Math.log(k2/k1))+'</sup> = '+fmt(k2)+' s<sup>−1</sup>. A higher temperature gives a larger <i>k</i>.',' s<sup>−1</sup>',KR);

   [Eac*1000,Rg*Math.log(k2r/k1)/(T2-T1)/1000,Math.log(k2r/k1)*0.08206/(1/T1-1/T2)/1000,Eac/2],

});

exp:[['4-2','4-3','4-4','4-5','4-6'],'Thomson measured the charge-to-mass ratio of the electron (cathode rays); Millikan’s oil-drop experiment (1909) gave the charge of the electron; Rutherford concluded that atoms have a tiny, massive, positive nucleus and are mostly empty space, because most α particles pass through a metal foil and a few are deflected; Moseley (1913) related X-ray wavelengths to atomic number; Chadwick interpreted the experiments that revealed the neutron (1932).'],

sym:[['4-5','4-6','4-7'],'The mass number is the number of protons plus the number of neutrons (always a whole number). The atomic number is the number of protons; a neutral atom has as many electrons as protons.'],
cmp:[['4-5','4-7'],'Isotopes are atoms of the same element (same number of protons) with different numbers of neutrons, hence different masses. The terms “isobars” and “isotones” are not used in Whitten; they are standard terms added here for the comparison.'],
nuc:[['4-5','4-6','4-7'],'Neutrons = mass number − atomic number; the atomic number is the number of protons; a neutral atom has as many electrons as protons.'],
avg:[['4-8','4-9'],'The atomic weight is the weighted average of the masses of the naturally occurring isotopes: each isotopic mass is multiplied by its fractional abundance and the products are added.'],
rule:[['4-15','4-18'],'Pauli Exclusion Principle: no two electrons in an atom may have identical sets of four quantum numbers. Hund’s Rule: electrons occupy all the orbitals of a subshell singly before pairing begins (parallel spins). Aufbau Principle: electrons fill the orbitals in order of increasing energy. Heisenberg Uncertainty Principle (1927): it is impossible to determine accurately both the momentum and the position of an electron at the same time.'],
qn:[['4-16'],'n = 1, 2, 3, … (any positive integer). l = 0, 1, 2, …, (n − 1). mℓ = −ℓ, …, 0, …, +ℓ. ms = +½ or −½.'],
qnorb:[['4-16','4-17'],'n is the shell, ℓ = 0, 1, 2, 3 for s, p, d, f; mℓ runs from −ℓ to +ℓ (so a subshell has 2ℓ + 1 orbitals); ms is +½ or −½.'],
cap:[['4-16','4-17','4-18'],'The number of mℓ values (−ℓ … +ℓ) is the number of orbitals in a subshell: s 1, p 3, d 5, f 7. By the Pauli principle an orbital holds at most two electrons, with opposite spins.'],
last:[['4-16','4-18'],'The last electron is the one added last in the filling order; its n and ℓ come from that subshell, and mℓ and ms must stay inside the allowed ranges.'],
cfg:[['4-18','4-19'],'Two rules predict the filling order (the (n + ℓ) rule): fill in order of increasing n + ℓ, and when n + ℓ is equal fill the lower n first (so 4s before 3d). The book stresses that these are guidelines with exceptions (for example, the special stability of filled or half-filled sets of orbitals).'],
unp:[['4-18','4-20'],'Hund’s Rule: electrons occupy all the orbitals of a subshell singly before pairing, with parallel spins. Substances with unpaired electrons are paramagnetic; those with all electrons paired are diamagnetic.'],
pos:[['4-19','4-10'],'The periodic table is organised by electron configuration: the period is set by the outer shell, and the group by the outer-shell electrons. §4-10 classifies the elements as metals, nonmetals and metalloids.'],
grp:[['4-10','5-1'],'The elements are classified as metals, nonmetals and metalloids; the groups of the table are the columns, the periods are the rows.'],
trend:[['5-2','5-3','5-5','5-6'],'Atomic radii increase down a group and generally decrease from left to right across a period. First ionization energies generally increase from left to right, with exceptions at Groups 3A and 6A. Cations are always smaller than their neutral atoms and anions are always larger. Electronegativity usually increases from left to right across a period and decreases down a group.'],
def:[['5-3','5-4','5-6'],'The first ionization energy is the minimum energy needed to remove the most loosely held electron from a gaseous atom. Electron affinity concerns adding an electron to a gaseous atom. Electronegativity is a measure of the relative tendency of an atom to attract electrons to itself when chemically combined with another atom.'],
ion:[['5-7'],'The oxidation state of a monoatomic ion is its charge: Group 1A +1, Group 2A +2, Group 3A +3 in common compounds. Nonmetals form negative ions.'],
dat:[['10-10','7-5'],'A coordinate covalent (dative) bond is a covalent bond in which one species supplies both of the shared electrons (the Lewis base); the Lewis theory is described in §10-10.'],
lew:[['7-5','7-6'],'Lewis formulas are built by counting valence electrons, placing the atoms, and giving each atom an octet (two for hydrogen); multiple bonds are used when the octet is not otherwise reached.'],
hyb:[['8-5','8-6','8-7'],'Hybridization table: 2 electron groups, linear, sp; 3 groups, trigonal planar, sp²; 4 groups, tetrahedral, sp³.'],
mol1:[['2-5','2-6'],'The mass of one mole of atoms in grams is numerically equal to the atomic weight in amu (the molar mass, g/mol). Avogadro’s number is 6.022 × 10²³ particles/mol.'],
pct:[['2-7','2-8'],'Percent composition = (mass of an element in the formula / formula weight) × 100. Empirical formula: convert masses to moles, divide by the smallest number of moles and, if needed, multiply to reach whole numbers.'],
stoich:[['3-1','3-2'],'The balanced equation gives the mole ratios between substances; mass → moles → mole ratio → moles of the wanted substance → mass.'],
boyle:[['12-4'],'Boyle’s law: at constant temperature the volume of a fixed amount of gas is inversely proportional to the pressure, so P₁V₁ = P₂V₂.'],
charles:[['12-5'],'Charles’s law: at constant pressure the volume of a fixed amount of gas is directly proportional to the absolute (kelvin) temperature, so V₁/T₁ = V₂/T₂.'],
ideal:[['12-9'],'Ideal gas equation PV = nRT with R = 0.08206 L·atm/(mol·K) (8.3145 J/(mol·K)); temperature in kelvin.'],
dalton:[['12-11'],'Dalton’s law: the total pressure of a gas mixture is the sum of the partial pressures; each partial pressure equals the mole fraction of that gas times the total pressure.'],
gcon:[['12-8','12-9'],'The standard molar volume of an ideal gas is 22.414 L at STP (0 °C, 1 atm). Boyle’s, Charles’s and Avogadro’s laws combine into PV = nRT.'],
conc:[['3-6','3-7','14-8'],'Molarity = moles of solute per liter of solution. Molality = moles of solute per kilogram of solvent. Mole fraction = moles of a component / total moles. In a dilution the moles of solute do not change.'],
colt:[['14-9','14-11','14-12','14-14','14-15'],'Raoult’s law lowers the vapor pressure; ΔTb = Kb·m and ΔTf = Kf·m (water: Kb = 0.512 °C/m, Kf = 1.86 °C/m); osmotic pressure π = MRT; for electrolytes the van’t Hoff factor i (ratio of the actual colligative effect to that of a non-dissociating solute) multiplies the effective concentration.'],
kexp:[['17-2','17-11'],'Kc = [products]/[reactants], each raised to its coefficient; pure solids and pure liquids do not appear (heterogeneous equilibria, §17-11).'],
kcalc:[['17-2','17-5'],'Kc is calculated from the equilibrium concentrations raised to the stoichiometric coefficients; an ICE table is used when only initial amounts are given.'],
kp:[['17-10'],'Kp = Kc(RT)^Δn, with Δn = (moles of gaseous products) − (moles of gaseous reactants); T in kelvin.'],
lech:[['17-6'],'Le Châtelier’s Principle: when a system at equilibrium is disturbed, it shifts to oppose the change (concentration, pressure/volume, temperature). A catalyst does not change the position of equilibrium.'],
qk:[['17-4'],'The reaction quotient Q has the same form as Kc but uses the concentrations at any moment. Comparing Q with Kc tells the direction: Q < Kc forward, Q > Kc reverse, Q = Kc equilibrium.'],
ksp:[['20-1'],'For a slightly soluble salt the solubility product is the product of the ion concentrations raised to their coefficients; with molar solubility S, MX gives Kps = S² and MX₂ gives Kps = 4S³.'],
prec:[['20-3','20-4'],'Compare the ion product Qsp with Ksp: Qsp > Ksp a precipitate forms; Qsp < Ksp the solution is unsaturated and a solid would dissolve.'],
common:[['19-1','20-3'],'The common ion effect (§19-1): adding an ion that is already in the equilibrium shifts it and lowers the solubility of a slightly soluble salt.'],
ph:[['18-3','18-4'],'pH = −log[H₃O⁺], pOH = −log[OH⁻] and pH + pOH = 14.00 at 25 °C (Kw = 1.0 × 10⁻¹⁴). For weak acids the ionization constant Ka is used with an equilibrium (ICE) table.'],
hyd:[['18-6','18-7','18-8','18-9'],'Salts of a strong base and a strong acid give neutral solutions; a strong base with a weak acid gives a basic solution (the anion reacts with water); a weak base with a strong acid gives an acidic solution. For a conjugate pair Ka·Kb = Kw (§18-8).'],
conj:[['10-4'],'In the Brønsted–Lowry theory an acid donates a proton and a base accepts one; a conjugate acid–base pair is two species that differ by a proton.'],
titr:[['11-2','11-3'],'At the end point of an acid–base titration the moles of H⁺ from the acid equal the moles of OH⁻ from the base, taking into account how many H⁺ or OH⁻ each formula unit provides.'],
buf:[['19-1','19-2'],'A buffer contains a weak acid and its conjugate base (or a weak base and its conjugate acid) in comparable amounts, so it resists changes in pH on adding small amounts of strong acid or base.'],
bufph:[['19-3'],'Henderson–Hasselbalch equation: pH = pKa + log([conjugate base]/[acid]).'],
strong:[['6-1'],'Table 6-1 lists the common strong acids: HCl, HBr, HI, HNO₃, HClO₄, HClO₃ (not always listed) and H₂SO₄. Weak acids ionize only partly.'],
abth:[['10-2','10-4','10-10'],'Arrhenius: acids give H⁺ in water, bases give OH⁻. Brønsted–Lowry: acids donate protons, bases accept them. Lewis: a base provides an electron pair to form a coordinate covalent bond, an acid accepts the pair.'],
nmf:[['6-3','6-4'],'Binary compounds are named with the ending -ide; oxyanions end in -ate or -ite, with the prefixes per- and hypo- for the extremes; Roman numerals show the charge of metals with several oxidation states.'],
nmw:[['6-3','6-4'],'Check each formula against the rules of §6-3 (binary compounds) and §6-4 (ternary acids and their salts): ending -ide/-ate/-ite, prefixes and Roman numerals must match the charges.'],
rxn:[['6-6','6-7','6-8','6-9','6-10','6-11','5-8','5-9'],'The book classifies reactions as combination, decomposition, displacement, metathesis and gas-formation reactions (§6-6 to 6-10, summary in §6-11); oxides of metals and nonmetals are described in §5-9.'],
ox:[['5-7','6-5'],'Rules for oxidation states: elements 0; monoatomic ions their charge; O usually −2 (−1 in peroxides); H usually +1; Group 1A +1 and Group 2A +2; the sum equals the charge of the species.'],
bal:[['3-1'],'A balanced equation has the same number of atoms of each element on both sides; only coefficients may be changed, never subscripts.'],
agent:[['6-5'],'Oxidation is an increase in oxidation state (loss of electrons) and reduction is a decrease; the substance oxidized is the reducing agent and the substance reduced is the oxidizing agent.'],
oname:[['23-2','23-3','23-4'],'Hydrocarbons are named from the longest chain containing the multiple bond, numbered to give the lowest locants, with substituents named and numbered (§23-2 saturated, §23-3 alkenes, §23-4 alkynes).'],
ofg:[['23-9','23-11','23-13','23-15'],'§23-15 summarises the functional groups: alcohols (–OH), aldehydes and ketones (C=O), carboxylic acids (–COOH), esters, amines, amides, ethers and halides.'],
ocis:[['23-3'],'Carbon atoms joined by a double bond cannot rotate easily about the bond axis, so geometric (cis–trans) isomers exist when each double-bond carbon carries two different groups (§23-3).'],
otype:[['23-16','23-17','23-18'],'Substitution (one group replaces another), addition (a double or triple bond becomes a single bond as atoms are added) and elimination (a small molecule is lost, forming a multiple bond) are the fundamental classes of organic reactions.'],
oform:[['23-1','23-3','23-4'],'Alkanes have the general formula CnH2n+2 (§23-1). Each double bond or ring removes two hydrogens: alkenes and cycloalkanes CnH2n, alkynes CnH2n−2 (this counting rule is standard; check §23-3 and §23-4).'],
isom:[['24-1','23-1'],'Constitutional isomers have the same molecular formula but different connectivity; to compare structures first work out the molecular formula of each.'],
ecell:[['21-9','21-14','21-15'],'Reduction occurs at the cathode and oxidation at the anode. E°cell is the difference of the standard reduction potentials, E°cathode − E°anode; potentials are not multiplied by coefficients.'],
nernst:[['21-19','21-20'],'Nernst equation at 25 °C: E = E° − (0.0592/n) log Q. A concentration cell has E° = 0.'],
krate:[['16-3'],'The rate-law expression has the form rate = k[A]^x[B]^y; the exponents are found by experiment and are not necessarily the coefficients of the balanced equation.'],
kinit:[['16-3'],'The method of initial rates finds the rate-law expression by changing one concentration at a time and observing the change in the initial rate.'],
kfirst:[['16-4'],'First order: ln([A]₀/[A]) = akt (Table 16-2), with a = 1 for A → products.'],
khalf:[['16-4'],'First order: t½ = ln 2/(ak) = 0.693/(ak); the half-life does not depend on the initial concentration.'],
ksecond:[['16-4'],'Second order: 1/[A] − 1/[A]₀ = akt; t½ = 1/(ak[A]₀).'],
kzero:[['16-4'],'Zero order: [A] = [A]₀ − akt; t½ = [A]₀/(2ak).'],
karr:[['16-8'],'Arrhenius equation: k = Ae^(−Ea/RT), or ln k = ln A − Ea/RT, with R = 8.314 J/(mol·K) when Ea is in J/mol; the greater Ea, the smaller k.'],
kcon:[['16-3','16-4','16-8','16-9'],'Table 16-2 gives rate law, integrated equation and half-life for orders 0, 1 and 2; catalysts lower Ea through an alternative pathway (§16-9); ln k versus 1/T has slope −Ea/R (Figure 16-14).']
};
