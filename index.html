<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalyst</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: single centered column; chips for topic, progress bar, one question card at a time. Dark neon quiz by the user's own spec. */
:root{--bg:#0a0a0f;--card:#13131c;--line:#2a2a3a;--fg:#e8e8f2;--dim:#8a8aa3;--neon:#39ffb4;--pink:#ff3d9a;--blue:#4da3ff;--amber:#ffb53d;color-scheme:dark;
--disp:'Unbounded','Arial Black',sans-serif;--mono:'Space Mono','Courier New',monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);font-size:15px;line-height:1.55;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;min-height:100vh}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:var(--disp);font-size:clamp(20px,5vw,30px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
h1 span{color:var(--neon)}
.sub{color:var(--dim);font-size:13px;margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);padding:7px 12px;cursor:pointer;border-radius:999px;min-height:36px}
.chip[aria-pressed="true"]{border-color:var(--neon);color:var(--neon);box-shadow:0 0 12px rgba(57,255,180,.25)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tog{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;margin-bottom:22px}
.tog input{width:18px;height:18px;accent-color:var(--neon)}
.btn{font-family:var(--disp);font-size:13px;font-weight:700;letter-spacing:.04em;color:#04130d;background:var(--neon);border:0;padding:14px 22px;cursor:pointer;border-radius:4px;min-height:48px;box-shadow:0 0 18px rgba(57,255,180,.35)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--neon));transition:width .3s}
.meta{display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:12px;margin-bottom:18px;flex-wrap:wrap}
.sec{color:var(--pink);text-transform:uppercase;letter-spacing:.1em}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px}
.q{font-size:16px;margin:0 0 18px;min-width:0;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;min-height:48px;overflow-wrap:anywhere}
.opt b{color:var(--blue);flex:none}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--neon);background:rgba(57,255,180,.08)}
.opt.ok b{color:var(--neon)}
.opt.no{border-color:var(--pink);background:rgba(255,61,154,.08)}
.opt.no b{color:var(--pink)}
.fb{margin-top:16px;padding:14px;border-left:3px solid var(--amber);background:rgba(255,181,61,.07);font-size:13.5px}
.fb strong{font-family:var(--disp);font-size:12px;display:block;margin-bottom:6px}
.fb .src{display:block;margin-top:8px;color:var(--dim);font-size:11.5px}
.how{margin-top:14px;padding:14px;border-left:3px solid var(--blue);background:rgba(77,163,255,.07);font-size:13.5px}.how strong{font-family:var(--disp);font-size:12px;display:block;color:var(--blue);margin-bottom:4px}.how p{margin:0 0 6px;color:var(--dim)}.how ol{margin:0;padding-left:20px}.how li{margin-bottom:4px}
.bkc{margin-top:14px;padding:12px 14px;border-left:3px solid var(--neon);background:rgba(57,255,180,.07);font-size:13.5px}.bkc strong{font-family:var(--disp);font-size:12px;display:block;color:var(--neon);margin-bottom:4px}.bkc p{margin:0 0 6px;color:var(--dim)}.bkc .bkr{font-size:12.5px;font-weight:600;color:var(--fg)}
.next{margin-top:16px;display:flex;justify-content:flex-end}
.score{font-family:var(--disp);font-size:clamp(44px,12vw,80px);color:var(--neon);margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0 20px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
th{color:var(--dim);font-weight:400}
.row{display:flex;gap:10px;flex-wrap:wrap}
.miss{margin:0 0 20px;padding:0;list-style:none;font-size:13px}
.miss li{padding:8px 0;border-bottom:1px solid var(--line)}
.fig{display:block;max-width:min(100%,380px);height:auto;background:#fff;padding:10px;border-radius:4px;margin:0 0 18px}
.wk{margin-top:14px;padding:14px;border-left:3px solid var(--neon);background:rgba(57,255,180,.06);font-size:13.5px}.wk strong{font-family:var(--disp);font-size:12px;display:block;color:var(--neon);margin-bottom:6px}.wk ol{margin:0;padding-left:20px}.wk li{margin-bottom:6px}.wk .src{display:block;margin-top:6px;color:var(--dim);font-size:11.5px}
.lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.topic{font-size:13.5px}.topic p{margin:0 0 10px}
.mi{padding:12px 0;border-top:1px solid var(--line)}.mi .ans{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:0 0 6px}.mi .bad{color:var(--pink)}.mi .good{color:var(--neon)}.mi .why{margin:0 0 8px;color:var(--dim);font-size:13px}
.opt.sel{border-color:var(--blue);background:rgba(77,163,255,.1)}.opt.sel b{color:var(--neon)}
.timer{font-family:var(--disp);color:var(--neon)}.timer.low{color:var(--pink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-bottom:16px}
.gb{font:inherit;font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:4px;min-height:36px;cursor:pointer}
.gb.an{border-color:var(--blue);color:var(--blue)}.gb.cur{background:var(--blue);color:#04130d;border-color:var(--blue)}
.pass{color:var(--neon)}.fail{color:var(--pink)}
.pb{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:80px}.pb i{display:block;height:100%;background:var(--neon)}.pb i.w{background:var(--pink)}.pb i.m{background:var(--amber)}
.rv{padding:14px 0;border-top:1px solid var(--line)}.rv .st{font-family:var(--disp);font-size:12px}
.beta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#04130d;background:var(--amber);padding:3px 8px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.credit{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}.credit b{color:var(--fg)}.credit a{color:var(--neon)}
.rep-wrap{margin-top:12px}.rep{font:inherit;font-size:12px;color:var(--dim);background:transparent;border:1px dashed var(--line);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:36px}.rep:hover{color:var(--fg);border-color:var(--dim)}.rep-out{margin-top:8px;font-size:12.5px;color:var(--dim)}.rep-out a{color:var(--neon)}.rep-out textarea{width:100%;margin-top:6px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font:inherit;font-size:12px;padding:8px}
.hint{background:var(--card);border:1px solid var(--blue);border-radius:6px;padding:14px;margin:0 0 16px;font-size:13px}.hint button{margin-top:10px}
.lvwrap{margin:0 0 12px}
.big-wrap{display:grid;gap:12px;margin-bottom:16px}
.big{font:inherit;text-align:left;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 18px;cursor:pointer;display:grid;gap:4px;min-height:72px}
.big b{font-family:var(--disp);font-size:16px;color:var(--neon)}
.big span{color:var(--dim);font-size:13px}
.big:hover{border-color:var(--neon);box-shadow:0 0 14px rgba(57,255,180,.2)}
.big:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.dubn{display:block;margin:0 0 8px;padding:8px 10px;border-left:4px solid #d98a00;background:#fff1d9;color:#5a3a00;border-radius:4px;font-size:13px}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .dubn{background:#3a2a0c;color:#ffdca0}}:root[data-theme=dark] .dubn{background:#3a2a0c;color:#ffdca0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>

var Q=[
// ATOM
{s:"Atom & particles",q:"Rutherford directed a beam of alpha particles at a thin metal foil. From these experiments he concluded that:",o:["the positively charged parts of atoms are moving about with a velocity approaching the speed of light.","electrons are massive particles.","electrons travel in circular orbits around the nucleus.","the positively charged parts of atoms are extremely small and extremely heavy particles.","the diameter of an electron is approximately equal to that of the nucleus."],a:3,e:"Most alpha particles passed straight through and only about 0.001% bounced back. That means the positive charge and most of the mass sit in a tiny, dense nucleus (about 1/10,000 of the atom's diameter). Circular orbits are Bohr's model, not a Rutherford conclusion.",r:"Esame 1 Q16, Esame 3 Q23"},
{s:"Atom & particles",q:"Which of the following has a positive charge?",o:["electron","anion","atom","proton","neutron"],a:3,e:"The proton carries +1. The electron is −1, the neutron is neutral, a neutral atom has equal protons and electrons, and an anion is negative by definition.",r:"Esame 4 Q9"},
{s:"Atom & particles",q:"The species that contains 24 protons, 26 neutrons and 22 electrons would be represented by the symbol:",o:["<sup>50</sup>Cr<sup>2+</sup>","<sup>50</sup>V<sup>3+</sup>","<sup>26</sup>Cr<sup>2+</sup>","none of these","<sup>50</sup>Mn<sup>2+</sup>"],a:0,e:"Z = 24 is chromium. A = protons + neutrons = 24 + 26 = 50. Charge = protons − electrons = 24 − 22 = +2. The mass number is not the number of neutrons, so <sup>26</sup>Cr is wrong.",r:"Esame 5 Q14"},
{s:"Atom & particles",q:"Consider the species <sup>72</sup>Zn, <sup>75</sup>As and <sup>74</sup>Ge. These species have:",o:["the same number of neutrons.","the same number of protons.","the same mass number.","the same number of electrons.","the same number of protons and neutrons."],a:0,e:"Neutrons = A − Z: Zn 72 − 30 = 42, As 75 − 33 = 42, Ge 74 − 32 = 42. Protons differ (30, 33, 32) and so do the mass numbers.",r:"Esame 3 Q11, Esame 4 Q13"},
{s:"Atom & particles",q:"In the nucleus of the <sup>11</sup>B isotope of boron we have:",o:["6 protons and 6 neutrons","5 protons and 6 neutrons","6 protons and 5 neutrons","5 protons and 5 neutrons"],a:1,e:"Boron has Z = 5, so 5 protons. Neutrons = 11 − 5 = 6.",r:"Simulazione di dicembre Q24"},
{s:"Atom & particles",q:"What is the atomic weight of a hypothetical element consisting of two isotopes, one with mass = 64.23 amu (26.0%), and one with mass = 65.32 amu?",o:["65.0 amu","64.4 amu","65.3 amu","64.9 amu","64.8 amu"],a:0,e:"Weighted average = 0.260·64.23 + 0.740·65.32 = 16.70 + 48.34 = 65.04 ≈ 65.0 amu. The second abundance is 100 − 26.0 = 74.0%. The result must lie closer to the more abundant isotope (65.32).",r:"Esame 5 Q24, Simu 3 Q22"},
// QN
{s:"Quantum numbers",q:"The Heisenberg Principle states that:",o:["charged atoms (ions) must generate a magnetic field when they are in motion.","no two electrons in the same atom can have the same set of four quantum numbers.","electrons of atoms in their ground states enter energetically equivalent sets of orbitals singly before they pair up in any orbital of the set.","it is impossible to determine accurately both the position and momentum of an electron simultaneously.","two atoms of the same element must have the same number of protons."],a:3,e:"Heisenberg is the uncertainty principle. The second option is Pauli exclusion, the third is Hund's rule, the last is the definition of an element.",r:"Esame 1 Q30"},
{s:"Quantum numbers",q:"Which statement about the four quantum numbers which describe electrons in atoms is incorrect?",o:["The magnetic quantum number is related to the orientation of atomic orbitals in space.","l = subsidiary (or azimuthal) quantum number, l = 1, 2, 3, ... , (n+1)","m<sub>s</sub> = spin quantum number, m<sub>s</sub> = +1/2 or −1/2.","m<sub>l</sub> = magnetic quantum number, m<sub>l</sub> = (−l), ... , 0, ... , (+l)","n = principal quantum number, n = 1, 2, 3, ......"],a:1,e:"l runs from 0 to n − 1, not from 1 to n + 1. For n = 1 only l = 0 exists. The other four statements are correct.",r:"Esame 1 Q13"},
{s:"Quantum numbers",q:"Which of the following quantum number sets describes a 5d orbital?",o:["n=5, l=2, m<sub>l</sub>=3","n=5, l=2, m<sub>l</sub>=2","n=5, l=4, m<sub>l</sub>=2","n=6, l=2, m<sub>l</sub>=2"],a:1,e:"The 5 is n and d means l = 2. Then m<sub>l</sub> must be between −2 and +2, so 3 is impossible. l = 4 would be a 5g subshell and n = 6 would be a 6d orbital.",r:"Simu 5 Q23, Exam 23/01, Simulazione di dicembre Q7"},
{s:"Quantum numbers",q:"Which of the following sets of quantum numbers (n, l, m<sub>l</sub>) is not allowed?",o:["(3, 2, −1)","(2, 1, 0)","(2, 1, −2)","(2, 0, 0)"],a:2,e:"For l = 1, m<sub>l</sub> can only be −1, 0 or +1, so −2 is forbidden. The other sets respect l ≤ n − 1 and |m<sub>l</sub>| ≤ l.",r:"Test 7/02/2023 Q19"},
{s:"Quantum numbers",q:"The maximum number of electrons that can be accommodated in a sublevel for which l = 3 is:",o:["8","6","14","10","2"],a:2,e:"l = 3 is an f subshell with 2l + 1 = 7 orbitals, each holding 2 electrons: 14. Capacities: s 2, p 6, d 10, f 14.",r:"Esame 4 Q26"},
{s:"Quantum numbers",q:"Which atomic orbital is spherical in shape?",o:["they are all spherical","2s","4f","3p","3d"],a:1,e:"All s orbitals are spherical. p orbitals are dumbbell-shaped and d orbitals have cloverleaf (or dz² ring) shapes.",r:"Esame 5 Q13"},
{s:"Quantum numbers",q:"Which one of the following sets of quantum numbers could be those of the distinguishing (last) electron of Mo?",o:["n = 5, l = 1, m<sub>l</sub> = 9, m<sub>s</sub> = −1/2","n = 4, l = 0, m<sub>l</sub> = 0, m<sub>s</sub> = +1/2","n = 5, l = 2, m<sub>l</sub> = +2, m<sub>s</sub> = −1/2","n = 4, l = 2, m<sub>l</sub> = −1, m<sub>s</sub> = +1/2","n = 3, l = 2, m<sub>l</sub> = 0, m<sub>s</sub> = +1/2"],a:3,e:"Mo is [Kr] 5s¹ 4d⁵: for a transition metal the last electron enters the d subshell of period − 1, so n = 4, l = 2. The set with m<sub>l</sub> = 9 is impossible, the set with n = 4, l = 0 is an s electron, the set with n = 5, l = 2 is 5d (empty in Mo), and the set with n = 3 is 3d (a filled inner subshell). The exact m<sub>l</sub> and m<sub>s</sub> of the fifth d electron depend on the filling convention, so the official key picks the option with the right n and l.",r:"Esame 3 Q13, Esame 5"},
// CONFIG
{s:"Electron configurations",q:"Which of the following electron configurations is correct for nickel?",o:["[Ar] 4s² 3d⁸","[Kr] 4s¹ 4d⁸","[Kr] 4s¹ 3d⁸","[Kr] 4s² 3d⁸","[Ar] 4s¹ 3d⁸"],a:0,e:"Ni has Z = 28, so 28 − 18 = 10 electrons beyond [Ar]: 4s² 3d⁸. [Kr] has 36 electrons, too many. Ni is not one of the irregular cases (those are Cr and Cu).",r:"Esame 1 Q14, Esame 5 Q25"},
{s:"Electron configurations",q:"The ground state electron configuration for arsenic is:",o:["[Kr] 4s² 4p¹","1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d⁸ 4p⁵","1s² 2s² 2p⁶ 3s² 3p⁶ 4s² 3d¹⁰ 4p³","1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹² 4s² 4p¹","[Ar] 4s² 4p¹³"],a:2,e:"As has Z = 33: [Ar] 4s² 3d¹⁰ 4p³ (18 + 2 + 10 + 3 = 33). A d subshell holds at most 10 electrons and a p subshell at most 6, which excludes d¹² and p¹³.",r:"Esame 4 Q25"},
{s:"Electron configurations",q:"Which of the following is the correct electron configuration for Na⁺?",o:["1s² 2s² 2p⁶","1s² 2s² 2p⁶ 3s¹","1s² 2s² 2p⁶ 3s²","None"],a:0,e:"Na has 11 electrons (1s² 2s² 2p⁶ 3s¹). Losing the outer 3s electron gives 10 electrons, the neon configuration.",r:"Exam 23/01 Q13, Simu 5 Q13"},
{s:"Electron configurations",q:"The outer electronic configuration ns²np⁴ corresponds to which one of the following elements in its ground state?",o:["As","Cr","Br","Ca","S"],a:4,e:"Six outer electrons put the element in group 16 (VIA). Among the options only S is there. As is np³, Br is np⁵, Ca is ns² and Cr is a d-block metal.",r:"Esame 5 Q11"},
{s:"Electron configurations",q:"The atom having the valence-shell configuration 4s² 4p⁵ would be in:",o:["Group VIB and Period 7","Group VIIB and Period 4","Group IVB and Period 4","Group VIA and Period 5","Group VIIA and Period 4"],a:4,e:"Seven outer electrons (2 + 5) mean group VIIA (17); the highest n is 4, so period 4. It is bromine.",r:"Simu 4 Q19"},
// PERIODIC
{s:"Periodic table & trends",q:"What alkaline earth metal is located in period 3?",o:["Li","Sr","Mg","Ca","Na"],a:2,e:"Alkaline earth metals are group 2. In period 3 that is Mg. Ca is period 4, Sr period 5, Li and Na are group 1.",r:"Esame 4 Q21, Simu 4 Q2"},
{s:"Periodic table & trends",q:"Select the term best describing the series of elements: Mn, Fe, Co, Ni, Cu.",o:["d-transition metals","representative elements","halogens","alkaline earth metals","metalloids"],a:0,e:"They are filling the 3d subshell, so they are d-block (transition) metals.",r:"Esame 4 Q20, Simu 3 Q12"},
{s:"Periodic table & trends",q:"Which element has the largest atomic radius?",o:["Rb","Li","F","Na","I"],a:0,e:"Radius grows down a group and shrinks across a period. Rb is at the bottom of group 1 among the options and far to the left of I in period 5.",r:"Simu 3 Q11"},
{s:"Periodic table & trends",q:"Which element has the lowest first ionization energy?",o:["Xe","Ar","Kr","Ne","He"],a:0,e:"IE decreases down a group because the outer electron is farther from the nucleus and shielded. Xe is the lowest of these noble gases.",r:"Esame 3 Q22, Simu 3 Q28"},
{s:"Periodic table & trends",q:"Which of the following elements has the greatest attraction for electrons in a covalent bond?",o:["Ge","Br","Se","As","Bi"],a:1,e:"That is electronegativity, which increases left to right and bottom to top. Br is the farthest right in period 4 among these, and Bi is lower down.",r:"Esame 5 Q1, Esame 3 Q12"},
{s:"Periodic table & trends",q:"Which statement is wrong?",o:["The most stable ion of lithium is Li⁺.","A phosphorus atom is larger than an antimony atom.","The radius of a sodium atom is larger than that of a sodium cation.","Oxygen has a less negative electron affinity than fluorine.","The atomic weight of carbon is about 12."],a:1,e:"P (period 3) and Sb (period 5) are both group 15, and size grows down the group, so P is smaller than Sb. A cation is smaller than its atom (c), F has a more negative EA than O (d).",r:"Esame 1 Q17, Esame 3 Q29, Esame 4 Q28"},
{s:"Periodic table & trends",q:"Which term best describes the energy associated with the process Li(g) → Li⁺(g) + e⁻?",o:["none of these","binding energy","ionization energy","electron affinity","electronegativity"],a:2,e:"Removing an electron from a gaseous atom is the ionization energy. Electron affinity is the opposite step (gaining an electron), and electronegativity is not an energy of a process.",r:"Simu 4 Q12"},
{s:"Periodic table & trends",q:"Which of the following is classified as a metal?",o:["Ge","V","F","As","Ar"],a:1,e:"V is a d-block transition metal. Ge and As are metalloids, F is a halogen and Ar is a noble gas.",r:"Simu 3 Q24"},
{s:"Periodic table & trends",q:"What monoatomic ion would you expect iodine (Z = 53) to form?",o:["I⁻","I²⁻","I⁺","I³⁻"],a:0,e:"Iodine is in group 17: it gains one electron to reach the xenon configuration and form I⁻.",r:"Simu 5 Q20, Test 7/02/2023 Q17"},
// BONDING
{s:"Bonding & hybridization",q:"In which of the following compounds is there at least one dative bond between two atoms: Fe(NO<sub>3</sub>)<sub>3</sub>, Fe<sub>2</sub>(SO<sub>3</sub>)<sub>3</sub>, Pb(NO<sub>2</sub>)<sub>4</sub>?",o:["Fe(NO<sub>3</sub>)<sub>3</sub>, Fe<sub>2</sub>(SO<sub>3</sub>)<sub>3</sub>, Pb(NO<sub>2</sub>)<sub>4</sub>","Fe(NO<sub>3</sub>)<sub>3</sub>, Fe<sub>2</sub>(SO<sub>3</sub>)<sub>3</sub>","Fe<sub>2</sub>(SO<sub>3</sub>)<sub>3</sub>, Pb(NO<sub>2</sub>)<sub>4</sub>","Pb(NO<sub>2</sub>)<sub>4</sub>"],a:1,e:"A dative bond is a covalent bond where one atom supplies both electrons. In nitrate the N has no lone pair left after its bonds, so one N–O bond is dative (N→O); in sulfite, S has a lone pair and one S–O bond is dative. The official key draws nitrite without a dative bond (one N=O, one N–O⁻ and a lone pair on N).",r:"Simu 5 Q5, Exam 23/01"},
{s:"Bonding & hybridization",q:"The hybridization of sulphur in SO<sub>2</sub> is:",o:["no hybridization","sp²","sp","sp³"],a:1,e:"S has 2 bonded atoms and 1 lone pair, so 3 electron domains, which gives sp² (trigonal planar arrangement, bent molecule).",r:"Simu 5 Q15, Exam 23/01"},
{s:"Bonding & hybridization",q:"The nitrogen atom in hydrogen cyanide (HCN) is hybridized:",o:["sp³","sp","it is not hybridized","sp²"],a:1,e:"H–C≡N: nitrogen has one σ bond (to C) and one lone pair, so 2 electron domains → sp. The triple bond uses the two remaining p orbitals for π bonds.",r:"Simulazione di dicembre Q28"},
{s:"Bonding & hybridization",q:"The hybridization of carbon in carbonic acid is:",o:["sp","sp³","it is not hybridized","sp²"],a:3,e:"In H<sub>2</sub>CO<sub>3</sub> carbon has one C=O and two C–O bonds, so 3 electron domains and no lone pair: sp² (planar).",r:"Simulazione 2, Test 7/02/2023 Q22"},
{s:"Bonding & hybridization",q:"How many double bonds does the carbon atom make in CS<sub>2</sub>?",o:["2","3","1","0"],a:0,e:"CS<sub>2</sub> is S=C=S: carbon makes two double bonds (4 shared pairs, octet satisfied). The carbon is sp hybridized and the molecule is linear.",r:"Simu 7 Q7"}
];

var OFF=[{"s": "Acids, bases & pH", "t": "abth", "q": "Arrhenius defined an acid as:", "o": ["a species that can donate a proton.", "a species that can accept a pair of electrons.", "a species that can accept a proton.", "a sourse of H+ ions in water.", "a source of OH- ions in water."], "a": 3, "e": "Official key: a sourse of H+ ions in water..", "r": "Exam 18/01/2023 Q1, Exam sample 5 Q18", "off": 1}, {"s": "Acids, bases & pH", "t": "abth", "q": "In a sample of pure water, only one of the following statements is always true at all conditions of temperature and pressure. Which one is always true?", "o": ["pOH = 7.0", "[OH-] = 1.0 x 10-7 M", "pH = 7.0", "[H3O+] = [OH-]", "[H3O+] = 1.0 x 10-7 M"], "a": 3, "e": "Official key: [H3O+] = [OH-].", "r": "Exam 18/01/2023 Q2", "off": 1}, {"s": "Acids, bases & pH", "t": "abth", "q": "Which one of the following is likely to be the most soluble base?", "o": ["Zr(OH)3", "Ca(OH)2", "Cu(OH)2", "Zn(OH)2", "Ga(OH)3"], "a": 1, "e": "Official key: Ca(OH)2.", "r": "Exam 18/01/2023 Q3, Exam sample 3 Q4, Exam sample 5 Q3", "off": 1}, {"s": "Mole & stoichiometry", "t": "pct", "q": "A compound contains, by mass, 40.0% carbon, 6.71% hydrogen, and 53.3% oxygen. A 0.320 mole sample of this compound weighs 28.8 g. The molecular formula of this compound is:", "o": ["C2H4O2", "C2H4O", "C3H6O3", "CH2O", "C4H7O2"], "a": 2, "e": "Official key: C3H6O3.", "r": "Exam 18/01/2023 Q4", "off": 1, "w": ["Data: 40.0% C, 6.71% H, 53.3% O; 0.320 mol weigh 28.8 g. Find: molecular formula.", "Empirical formula (assume 100 g): C 40.0/12.01 = 3.331 mol; H 6.71/1.008 = 6.657 mol; O 53.3/16.00 = 3.331 mol. Divide by the smallest (3.331): C : H : O = 1 : 2.00 : 1 → CH<sub>2</sub>O (mass 30.03 g/mol).", "Molar mass from the sample: M = 28.8 g / 0.320 mol = 90.0 g/mol.", "Multiplier n = 90.0 / 30.03 = 3.00 ≈ 3 → C<sub>3</sub>H<sub>6</sub>O<sub>3</sub>.", "Check: C<sub>3</sub>H<sub>6</sub>O<sub>3</sub> = 3(12.01) + 6(1.008) + 3(16.00) = 90.08 g/mol ✓."]}, {"s": "Nomenclature & reactions", "t": "rxn", "q": "What salt is formed in the following acid/base reaction? HClO3 + Ba(OH)2", "o": ["H2O", "ClOBa", "BaCl2", "Ba(ClO3)2", "BaClO3"], "a": 3, "e": "Official key: Ba(ClO3)2.", "r": "Exam 18/01/2023 Q5", "off": 1}, {"s": "Mole & stoichiometry", "t": "mol1", "q": "How many atoms are in one mole of CH3OH?", "o": ["6", "12.0 x 1023", "3.6 x 1024", "3", "6.0 x 1023"], "a": 2, "e": "Official key: 3.6 x 1024.", "r": "Exam 18/01/2023 Q6, Exam sample 3 Q21", "off": 1, "w": ["Data: 1 mol of CH<sub>3</sub>OH. Find: number of atoms.", "One molecule has 1 C + 4 H + 1 O = 6 atoms (CH<sub>3</sub> has 3 H, plus the OH hydrogen).", "Atoms = 6 × 6.022×10<sup>23</sup> = 3.61×10<sup>24</sup>.", "Trap: 6.0×10<sup>23</sup> counts molecules, not atoms."]}, {"s": "Acids, bases & pH", "t": "abth", "q": "Consider the following reaction: NH3(g) + H2O(l) <-> NH4+(aq) + OH-(aq) Which one of the following statements is false?", "o": ["When ammonia is added to water, NH4+ and OH- ions are produced in a 1:1 ratio.", "Ammonia is considered to be a weak base.", "The reaction is reversible.", "The double arrows indicate that ammonia, NH3, is only very slightly soluble in water.", "When solutions of NH4Cl and NaOH are mixed, some ammonia is produced."], "a": 3, "e": "Official key: The double arrows indicate that ammonia, NH3, is only very slightly soluble in water..", "r": "Exam 18/01/2023 Q7, Exam sample 4 Q1", "off": 1}, {"s": "Acids, bases & pH", "t": "abth", "q": "According to the Lewis theory, a base _____ .", "o": ["produces OH- ions in aqueous solution.", "makes available a share in a pair of electrons.", "accepts a share in a pair of electrons.", "is a proton donor.", "is a proton acceptor."], "a": 1, "e": "Official key: makes available a share in a pair of electrons..", "r": "Exam 18/01/2023 Q8", "off": 1}, {"s": "Acids, bases & pH", "t": "titr", "q": "What volume of 0.50 M KOH would be required to neutralize completely 500 mL of 0.25 M H3PO4 solution?", "o": ["1.4 x 103 mL", "83 mL", "7.5 x 102 mL", "2.5 x 102 mL", "5.2 x 102 mL"], "a": 2, "e": "Official key: 7.5 x 102 mL.", "r": "Exam 18/01/2023 Q9, Exam sample 4 Q7", "off": 1, "w": ["Data: 500 mL of 0.25 M H<sub>3</sub>PO<sub>4</sub>; 0.50 M KOH. Find: volume of KOH for complete neutralization.", "Principle: complete neutralization means equivalents of acid = equivalents of base. H<sub>3</sub>PO<sub>4</sub> gives 3 H<sup>+</sup>, KOH gives 1 OH<sup>−</sup>.", "mol H<sub>3</sub>PO<sub>4</sub> = 0.25 × 0.500 L = 0.125 mol → mol H<sup>+</sup> = 3 × 0.125 = 0.375.", "V(KOH) = 0.375 mol / 0.50 mol/L = 0.75 L = 750 mL.", "Trap: forgetting the factor 3 gives 250 mL."]}, {"s": "Solutions & colligative properties", "t": "colt", "q": "A solution made by dissolving 9.81 g of a nonvolatile nonelectrolyte in 90.0 g of water boiled at 100.37 oC at 760 mm Hg. What is the approximate molecular weight of the substance? (For water, Kb = 0.51 oC/m)", "o": ["150 g/mol", "240 g/mol", "61 g/mol", "79 g/mol", "34 g/mol"], "a": 0, "e": "Official key: 150 g/mol.", "r": "Exam 18/01/2023 Q10", "off": 1, "w": ["Data: 9.81 g of solute in 90.0 g water; T<sub>b</sub> = 100.37 °C; K<sub>b</sub> = 0.51 °C/m; nonelectrolyte (i = 1). Find: molar mass.", "Principle: ΔT<sub>b</sub> = K<sub>b</sub>·m·i.", "ΔT<sub>b</sub> = 100.37 − 100.00 = 0.37 °C → m = 0.37/0.51 = 0.7255 mol/kg.", "mol solute = m × kg solvent = 0.7255 × 0.0900 = 0.06529 mol.", "M = 9.81 g / 0.06529 mol = 150 g/mol."]}, {"s": "Solutions & colligative properties", "t": "conc", "q": "Calculate the normality of a solution that contains 4.5 g of (COOH)2 in 3000 mL of solution? (Assume the (COOH)2 is to be completely neutralized in an acid-base reaction.)", "o": ["0.090 N", "0.12 N", "0.045 N", "0.066 N", "0.033 N"], "a": 4, "e": "Official key: 0.033 N.", "r": "Exam 18/01/2023 Q11", "off": 1, "w": ["Data: 4.5 g of (COOH)<sub>2</sub> in 3000 mL. Find: normality (complete neutralization).", "Principle: N = equivalents / litres; equivalents = moles × (H<sup>+</sup> per molecule). Oxalic acid has 2 acidic H.", "M<sub>r</sub>((COOH)<sub>2</sub>) = 2(12.01) + 2(1.008) + 4(16.00) = 90.04 g/mol → 0.0500 mol.", "Equivalents = 2 × 0.0500 = 0.1000 eq.", "N = 0.1000 eq / 3.000 L = 0.0333 N."]}, {"s": "Solutions & colligative properties", "t": "colt", "q": "If 4.27 grams of sucrose, C12H22O11, are dissolved in 15.2 grams of water, what will be the boiling point of the resulting solution? (Keb for water = 0.512 oC/m)", "o": ["100.73 oC", "99.626 oC", "100.42 oC", "101.42 oC", "101.64 oC"], "a": 2, "e": "Official key: 100.42 oC.", "r": "Exam 18/01/2023 Q12", "off": 1, "w": ["Data: 4.27 g sucrose in 15.2 g water; K<sub>eb</sub> = 0.512 °C/m. Find: boiling point.", "M<sub>r</sub>(C<sub>12</sub>H<sub>22</sub>O<sub>11</sub>) = 342.3 g/mol → 0.01247 mol.", "m = 0.01247 / 0.0152 kg = 0.821 mol/kg (sucrose does not dissociate, i = 1).", "ΔT<sub>b</sub> = 0.512 × 0.821 = 0.420 °C → T<sub>b</sub> = 100 + 0.42 = 100.42 °C."]}, {"s": "Quantum numbers", "t": "qn", "q": "Which statement about the four quantum numbers which describe electrons in atoms is incorrect?", "o": ["The magnetic quantum number is related to the orientation of atomic orbitals in space.", "l = subsidiary (or azimuthal) quantum number, l = 1, 2, 3, ... , (n+1)", "ms = spin quantum number, ms = +1/2 or -1/2.", "ml = magnetic quantum number, ml = (-l), .... , 0, .... , (+l)", "n = principal quantum number, n = 1, 2, 3, ......"], "a": 1, "e": "Official key: l = subsidiary (or azimuthal) quantum number, l = 1, 2, 3, ... , (n+1).", "r": "Exam 18/01/2023 Q13", "off": 1}, {"s": "Electron configurations", "t": "cfg", "q": "Which of the following electron configurations is correct for nickel?", "o": ["[Ar] 4s1 3d8", "[Kr] 4s1 3d8", "[Kr] 4s1 4d8", "[Ar] 4s2 3d8", "[Kr] 4s2 3d8"], "a": 3, "e": "Official key: [Ar] 4s2 3d8.", "r": "Exam 18/01/2023 Q14, Exam sample 5 Q25", "off": 1}, {"s": "Acids, bases & pH", "t": "hyd", "q": "Calculate the hydrolysis constant for the cyanide ion, CN- (ka=4*10^-10).", "o": ["none of these", "4.0 x 10-10", "5.6 x 10-10", "1.0 x 10-7", "2.5 x 10-5"], "a": 4, "e": "Official key: 2.5 x 10-5.", "r": "Exam 18/01/2023 Q15", "off": 1, "w": ["Data: K<sub>a</sub>(HCN) = 4×10<sup>−10</sup>. Find: hydrolysis constant of CN<sup>−</sup>.", "Principle: CN<sup>−</sup> + H<sub>2</sub>O ⇌ HCN + OH<sup>−</sup>; K<sub>h</sub> = K<sub>b</sub> = K<sub>w</sub>/K<sub>a</sub>.", "K<sub>h</sub> = 1.0×10<sup>−14</sup> / 4×10<sup>−10</sup> = 2.50×10<sup>−5</sup>."]}, {"s": "Atom & particles", "t": "exp", "q": "Rutherford carried out experiments in which a beam of alpha particles was directed at a thin piece of metal foil. From these experiments he concluded that:", "o": ["the positively charged parts of atoms are moving about with a velocity approaching the speed of light.", "electrons are massive particles.", "electrons travel in circular orbits around the nucleus.", "the positively charged parts of atoms are extremely small and extremely heavy particles.", "the diameter of an electron is approximately equal to that of the nucleus."], "a": 3, "e": "Official key: the positively charged parts of atoms are extremely small and extremely heavy particles..", "r": "Exam 18/01/2023 Q16, Exam sample 4 Q16", "off": 1}, {"s": "Periodic table & trends", "t": "trend", "q": "Which statement is wrong?", "o": ["The most stable ion of lithium is Li+.", "A phosphorus atom is larger than an antimony atom.", "The radius of a sodium atom is larger than that of a sodium cation.", "Oxygen has a less negative electron affinity than fluorine.", "The atomic weight of carbon is about 12."], "a": 1, "e": "Official key: A phosphorus atom is larger than an antimony atom..", "r": "Exam 18/01/2023 Q17, Exam sample 4 Q28", "off": 1}, {"s": "Chemical equilibrium", "t": "kcalc", "q": "A quantity of HI was sealed in a tube, heated to 425oC and held at this temperature until equilibrium was reached. The concentration of HI in the tube at equilibrium was found to be 0.0706 mol/L. Calculate the equilibirum concentration of H2 (and I2). For the gas-phase reaction, H2 + I2 <-> 2HI Kc = 54.6 at 425oC", "o": ["1.17 x 10-3 M", "1.85 x 10-4 M", "9.55 x 10-3 M", "4.78 x 10-3 M", "2.34 x 10-3 M"], "a": 2, "e": "Official key: 9.55 x 10-3 M.", "r": "Exam 18/01/2023 Q18", "off": 1, "w": ["Data: [HI] = 0.0706 M at equilibrium; K<sub>c</sub> = 54.6 for H<sub>2</sub> + I<sub>2</sub> ⇌ 2HI. Find: [H<sub>2</sub>] (= [I<sub>2</sub>], because HI came from decomposition: 2HI → H<sub>2</sub> + I<sub>2</sub>).", "K<sub>c</sub> = [HI]<sup>2</sup> / ([H<sub>2</sub>][I<sub>2</sub>]) = [HI]<sup>2</sup> / x<sup>2</sup>.", "x<sup>2</sup> = (0.0706)<sup>2</sup> / 54.6 = 9.129e-05 → x = 9.55×10<sup>−3</sup> M."]}, {"s": "Acids, bases & pH", "t": "hyd", "q": "Calculate the pH of a 0.50 M solution of NaNO2 (Ka HNO2=7.1*10^-4).", "o": ["8.52", "1.82", "12.18", "5.48", "7.00"], "a": 0, "e": "Official key: 8.52.", "r": "Exam 18/01/2023 Q19, Exam sample 5 Q22", "off": 1, "w": ["Data: 0.50 M NaNO<sub>2</sub>; K<sub>a</sub>(HNO<sub>2</sub>) = 7.1×10<sup>−4</sup>. Find: pH.", "Principle: Na<sup>+</sup> is neutral; NO<sub>2</sub><sup>−</sup> is the conjugate base of a weak acid and hydrolyses: NO<sub>2</sub><sup>−</sup> + H<sub>2</sub>O ⇌ HNO<sub>2</sub> + OH<sup>−</sup>.", "K<sub>b</sub> = K<sub>w</sub>/K<sub>a</sub> = 10<sup>−14</sup>/7.1×10<sup>−4</sup> = 1.41×10<sup>−11</sup>.", "[OH<sup>−</sup>] = √(K<sub>b</sub>·C) = √(1.41×10<sup>−11</sup> × 0.50) = 2.65×10<sup>−6</sup> M.", "pOH = 5.576 → pH = 14 − 5.576 = 8.42.", "<b>Check:</b> the recomputed value is 8.42, the official key is 8.52. The key is the nearest option and the only basic one, but it differs by 0.10 pH units from the exact calculation (pH = 7 + ½pK<sub>a</sub> + ½log C = 8.42). Probably a rounding/typo in the exam key; the answer to choose is still 8.52."]}, {"s": "Solubility (Kps)", "t": "prec", "q": "If we add 5mg of FeF2 (Kps=2.36*10-6 mol3/L3) to 200mL of water at 25oC, ...", "o": ["the salt precipitates since it has S=8.39*10-6 M", "the salt does not precipitate since it has S=2.36*10-6 M", "the salt precipitates since it has S=2.65*10-4 M", "the salt precipitates since it has S=8.39*10-3 M", "the salt does not precipitate since it has S=8.39*10-3 M"], "a": 4, "e": "Official key: the salt does not precipitate since it has S=8.39*10-3 M.", "r": "Exam 18/01/2023 Q20", "off": 1, "w": ["Data: 5 mg FeF<sub>2</sub> in 200 mL water; K<sub>ps</sub> = 2.36×10<sup>−6</sup>.", "Principle: compare the total amount that could dissolve with the solubility S. FeF<sub>2</sub> ⇌ Fe<sup>2+</sup> + 2F<sup>−</sup>, K<sub>ps</sub> = S(2S)<sup>2</sup> = 4S<sup>3</sup>.", "S = (K<sub>ps</sub>/4)<sup>1/3</sup> = (5.900e-07)<sup>1/3</sup> = 8.39×10<sup>−3</sup> M.", "Concentration if all dissolved: M<sub>r</sub> = 93.85 g/mol → 0.005 g / 93.85 = 5.328e-05 mol in 0.200 L = 2.66×10<sup>−4</sup> M.", "2.66×10<sup>−4</sup> M &lt; S = 8.39×10<sup>−3</sup> M → everything dissolves, no precipitate."]}, {"s": "Solubility (Kps)", "t": "ksp", "q": "We add 10g of Ca(BrO2)2 (Kps=2.43*10-4 mol3/L3) to 100mL of water at 25oC. What is the solubility S?", "o": ["1.14 M", "3.25 M", "0.039 M", "0.38 M", "0.19 M"], "a": 2, "e": "Official key: 0.039 M.", "r": "Exam 18/01/2023 Q21", "off": 1, "w": ["Data: K<sub>ps</sub>[Ca(BrO<sub>2</sub>)<sub>2</sub>] = 2.43×10<sup>−4</sup>. Find: solubility S (mol/L) in water.", "Ca(BrO<sub>2</sub>)<sub>2</sub> ⇌ Ca<sup>2+</sup> + 2BrO<sub>2</sub><sup>−</sup>: [Ca<sup>2+</sup>] = S, [BrO<sub>2</sub><sup>−</sup>] = 2S → K<sub>ps</sub> = S(2S)<sup>2</sup> = 4S<sup>3</sup>.", "S = (2.43×10<sup>−4</sup>/4)<sup>1/3</sup> = (6.075e-05)<sup>1/3</sup> = 0.0393 M.", "The 10 g in 100 mL (0.38 M if all dissolved) only tells you the salt is in excess; S does not depend on the quantity added."]}, {"s": "Solutions & colligative properties", "t": "colt", "q": "What are the ideal van't Hoff factors for the following compounds: Ba(OH)2, C6H12O6, K3PO4, HNO3 ?", "o": ["3, 1, 4, 2", "2, 1, 2, 2", "6, 3, 5, 5", "1, 1, 1, 1", "none of the above"], "a": 0, "e": "Official key: 3, 1, 4, 2.", "r": "Exam 18/01/2023 Q22, Exam sample 5 Q23", "off": 1, "w": ["Data: Ba(OH)<sub>2</sub>, C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>, K<sub>3</sub>PO<sub>4</sub>, HNO<sub>3</sub>. Find: ideal van't Hoff factor i (particles per formula unit).", "Ba(OH)<sub>2</sub> → Ba<sup>2+</sup> + 2OH<sup>−</sup>: i = 3.", "Glucose does not dissociate: i = 1.", "K<sub>3</sub>PO<sub>4</sub> → 3K<sup>+</sup> + PO<sub>4</sub><sup>3−</sup>: i = 4.", "HNO<sub>3</sub> (strong acid) → H<sup>+</sup> + NO<sub>3</sub><sup>−</sup>: i = 2. Answer: 3, 1, 4, 2."]}, {"s": "Chemical equilibrium", "t": "kexp", "q": "The conventional equilibrium constant expression (Kc) for the system below is: 2ICl(s) <-> I2(s) + Cl2(g)", "o": ["([I2] + [Cl2])/2[ICl]", "[Cl2]", "[I2][Cl2]/[ICl]2", "[I2][Cl2]/2[ICl]", "[Cl2]/[ICl]2"], "a": 1, "e": "Official key: [Cl2].", "r": "Exam 18/01/2023 Q23", "off": 1}, {"s": "Mole & stoichiometry", "t": "pct", "q": "Guanidin, HNC(NH2)2, is a fertilizer. To three significant figures, what is the percent by mass of nitrogen in the fertilizer?", "o": ["71.1%", "49.4%", "54.8%", "45.2%", "65.1%"], "a": 0, "e": "Official key: 71.1%.", "r": "Exam 18/01/2023 Q24", "off": 1, "w": ["Data: guanidine HNC(NH<sub>2</sub>)<sub>2</sub>. Find: mass % N (3 s.f.).", "Formula: 1 C + 5 H (1 on N, 2×2 on the two NH<sub>2</sub>) + 3 N = CH<sub>5</sub>N<sub>3</sub>.", "M<sub>r</sub> = 12.01 + 5(1.008) + 3(14.01) = 59.08 g/mol.", "% N = 3(14.01)/59.08 × 100 = 71.1 %."]}, {"s": "Gases", "t": "gcon", "q": "A real gas most closely approaches the behavior of an ideal gas under conditions of:", "o": ["low P and high T", "STP", "high P and low T", "low P and T", "high P and T"], "a": 0, "e": "Official key: low P and high T.", "r": "Exam 18/01/2023 Q25, Exam sample 5 Q12", "off": 1}, {"s": "Chemical equilibrium", "t": "kcalc", "q": "Consider the following reversible reaction. In a 3.00 liter container, the following amounts are found in equilibrium at 400 oC: 0.0420 mole N2, 0.516 mole H2 and 0.0357 mole NH3. Evaluate Kc. N2(g) + 3H2(g) 2NH3(g)", "o": ["16.0", "1.99", "0.202", "0.503", "4.94"], "a": 1, "e": "Official key: 1.99.", "r": "Exam 18/01/2023 Q26", "off": 1, "w": ["Data: V = 3.00 L; N<sub>2</sub> 0.0420 mol, H<sub>2</sub> 0.516 mol, NH<sub>3</sub> 0.0357 mol at equilibrium. N<sub>2</sub> + 3H<sub>2</sub> ⇌ 2NH<sub>3</sub>.", "K<sub>c</sub> uses concentrations (mol/L), so divide each amount by 3.00 L first.", "[N<sub>2</sub>] = 0.0140, [H<sub>2</sub>] = 0.1720, [NH<sub>3</sub>] = 0.0119 M.", "K<sub>c</sub> = [NH<sub>3</sub>]<sup>2</sup> / ([N<sub>2</sub>][H<sub>2</sub>]<sup>3</sup>) = (0.0119)<sup>2</sup> / (0.0140 × 0.172<sup>3</sup>) = 1.99."]}, {"s": "Solubility (Kps)", "t": "ksp", "q": "The Kps of Ni(OH)2 is 1.6*10-16 mol3/L3. Calculate the solubility of the hydroxide in pure water and in a solution 0.1M of NaOH.", "o": ["3.42*10-6 M; 2*10-11 M", "3.42*10-6 M; 1.6*10-14 M", "6.42*10-4 M; 1.6*10-14 M", "3.42*10-14 M; 1.6*10-14 M", "1.6*10-16 M; 5.55*10-14 M"], "a": 1, "e": "Official key: 3.42*10-6 M; 1.6*10-14 M.", "r": "Exam 18/01/2023 Q27, Exam sample 3 Q18", "off": 1, "w": ["Data: K<sub>ps</sub>[Ni(OH)<sub>2</sub>] = 1.6×10<sup>−16</sup>. Find: S in pure water and in 0.1 M NaOH.", "Ni(OH)<sub>2</sub> ⇌ Ni<sup>2+</sup> + 2OH<sup>−</sup>.", "Pure water: K<sub>ps</sub> = S(2S)<sup>2</sup> = 4S<sup>3</sup> → S = (4.0e-17)<sup>1/3</sup> = 3.42×10<sup>−6</sup> M.", "In 0.1 M NaOH (common ion): [OH<sup>−</sup>] ≈ 0.1 (the OH<sup>−</sup> from the salt is negligible), so S = K<sub>ps</sub>/[OH<sup>−</sup>]<sup>2</sup> = 1.6×10<sup>−16</sup>/(0.1)<sup>2</sup> = 1.60×10<sup>−14</sup> M.", "The solubility drops by 8 orders of magnitude: common-ion effect."]}, {"s": "Solutions & colligative properties", "t": "conc", "q": "Calculate the molality of a solution that contains 51.2 g of naphthalene, C10H8, in 500 mL of carbon tetrachloride. The density of CCl4 is 1.60 g/mL.", "o": ["0.500 m", "0.250 m", "0.840 m", "0.750 m", "1.69 m"], "a": 0, "e": "Official key: 0.500 m.", "r": "Exam 18/01/2023 Q28, Exam sample 4 Q11", "off": 1, "w": ["Data: 51.2 g C<sub>10</sub>H<sub>8</sub> in 500 mL CCl<sub>4</sub>, d = 1.60 g/mL. Find: molality.", "Molality = mol solute / kg solvent. The volume of solvent must be converted to mass with the density.", "M<sub>r</sub>(C<sub>10</sub>H<sub>8</sub>) = 128.16 → n = 51.2/128.16 = 0.3995 mol.", "Solvent mass = 500 mL × 1.60 g/mL = 800 g = 0.800 kg.", "m = 0.3995/0.800 = 0.499 mol/kg."]}, {"s": "Solutions & colligative properties", "t": "colt", "q": "Calculate the osmotic pressure associated with 50.0 g of an enzyme of molecular weight 98,000 g/mol dissolved in water to give 2600 mL of solution at 30.0 oC.", "o": ["1.96 torr", "3.71 torr", "0.484 torr", "2.48 torr", "1.68 torr"], "a": 1, "e": "Official key: 3.71 torr.", "r": "Exam 18/01/2023 Q29", "off": 1, "w": ["Data: 50.0 g of enzyme, M = 98 000 g/mol, V = 2600 mL, T = 30.0 °C. Find: osmotic pressure in torr.", "π = MRT (nonelectrolyte, i = 1), T in kelvin.", "n = 50.0/98 000 = 5.102e-04 mol; molarity = 5.102e-04/2.600 L = 1.962e-04 M.", "T = 30.0 + 273.15 = 303.15 K → π = 1.962e-04 × 0.0821 × 303.15 = 4.884e-03 atm.", "π = 4.884e-03 atm × 760 torr/atm = 3.71 torr."]}, {"s": "Quantum numbers", "t": "qn", "q": "The Heisenberg Principle states that _____________.", "o": ["charged atoms (ions) must generate a magnetic field when they are in motion.", "no two electrons in the same atom can have the same set of four quantum numbers.", "electrons of atoms in their ground states enter energetically equivalent sets of orbitals singly before they pair up in any orbital of the set.", "it is impossible to determine accurately both the position and momentum of an electron simultaneously.", "two atoms of the same element must have the same number of protons."], "a": 3, "e": "Official key: it is impossible to determine accurately both the position and momentum of an electron simultaneously..", "r": "Exam 18/01/2023 Q30", "off": 1}, {"s": "Solutions & colligative properties", "t": "conc", "q": "Calculate the molarity of a solution obtained by dissolving 7.9 g of calcium phosphate in 500 g of water.", "o": ["2.31 mol/L", "0.051 mol/L", "0.098 mol/L", "5.1 • 10-5 mol/L"], "a": 1, "e": "Official key: 0.051 mol/L.", "r": "Exam 23/01/2023 Q1", "off": 1, "w": ["Data: 7.9 g Ca<sub>3</sub>(PO<sub>4</sub>)<sub>2</sub> in 500 g water. Find: molarity (mol/L).", "M<sub>r</sub> = 3(40.08) + 2(30.97) + 8(16.00) = 310.18 g/mol → n = 0.0255 mol.", "Assumption: dilute aqueous solution, 500 g of water ≈ 0.500 L of solution (the volume of the solution is not given).", "M = 0.0255/0.500 = 0.051 mol/L."]}, {"s": "Acids, bases & pH", "t": "hyd", "q": "The pH of 100 mL of a 0.1 M ammonium chloride solution (kb ammonium hydroxide= 1.76 ·10-5 mol/L) is:", "o": ["Neutral", "Negative", "Basic", "Acidic"], "a": 3, "e": "Official key: Acidic.", "r": "Exam 23/01/2023 Q2", "off": 1, "w": ["Data: 0.1 M NH<sub>4</sub>Cl; K<sub>b</sub>(NH<sub>3</sub>) = 1.76×10<sup>−5</sup>. Find: acidic, basic or neutral.", "NH<sub>4</sub><sup>+</sup> is the conjugate acid of a weak base and hydrolyses (NH<sub>4</sub><sup>+</sup> + H<sub>2</sub>O ⇌ NH<sub>3</sub> + H<sub>3</sub>O<sup>+</sup>); Cl<sup>−</sup> comes from a strong acid and does nothing.", "K<sub>a</sub> = K<sub>w</sub>/K<sub>b</sub> = 5.68×10<sup>−10</sup>; [H<sup>+</sup>] = √(5.68×10<sup>−10</sup> × 0.1) = 7.54×10<sup>−6</sup> M → pH = 5.12 &lt; 7: acidic."]}, {"s": "Nomenclature & reactions", "t": "nmf", "q": "Name the following compounds: AlCl3, NH4ClO4, Fe(NO3)3", "o": ["ALUMINIUM (III) CHLORATE, AMMONIUM HYPOCHLORATE, IRON (II) NITRATE", "ALUMINIUM (III) CHLORIDE, AMMONIUM PERCHLORATE, IRON (III) NITRATE", "ALUMINIUM (III) CHLORIDE, AMMONIUM PERCHLORITE, IRON (III) NITRATE", "ALUMINIUM (III) CHLORITE, AMMONIUM HYPOCHLORITE, IRON (II) NITRATE"], "a": 1, "e": "Official key: ALUMINIUM (III) CHLORIDE, AMMONIUM PERCHLORATE, IRON (III) NITRATE.", "r": "Exam 23/01/2023 Q4", "off": 1}, {"s": "Solutions & colligative properties", "t": "colt", "q": "Calculate the osmotic pressure of 20 mL of a solution in which 2 g of iron (II) chloride are dissolved at room temperature (25 °C).", "o": ["57.91 atm", "28.37 atm", "19.3 atm", "19.82 atm"], "a": 0, "e": "Official key: 57.91 atm.", "r": "Exam 23/01/2023 Q5", "off": 1, "w": ["Data: 2 g FeCl<sub>2</sub> in 20 mL, 25 °C. Find: osmotic pressure.", "FeCl<sub>2</sub> → Fe<sup>2+</sup> + 2Cl<sup>−</sup>: i = 3. π = M R T i.", "M<sub>r</sub> = 126.75 g/mol → n = 0.01578 mol; M = 0.01578/0.0200 L = 0.789 M.", "π = 0.789 × 0.0821 × 298.15 × 3 = 57.94 atm. (The key 57.91 uses slightly different rounding of R and M<sub>r</sub>.)"]}, {"s": "Gases", "t": "ideal", "q": "Calculate the quantity in grams of (gaseous) chlorine which occupies a volume of 682 mL at a temperature of 38.2 °C and a pressure of 0.57 atm.", "o": ["0.54 g", "3.928 g", "1.078 g", "2.912 g"], "a": 2, "e": "Official key: 1.078 g.", "r": "Exam 23/01/2023 Q6", "off": 1, "w": ["Data: V = 682 mL = 0.682 L, T = 38.2 °C, P = 0.57 atm, gas Cl<sub>2</sub>. Find: mass.", "PV = nRT → n = PV/RT, then m = n·M.", "T = 38.2 + 273.15 = 311.35 K → n = (0.57 × 0.682)/(0.0821 × 311.35) = 0.01521 mol.", "m = 0.01521 × 70.90 g/mol = 1.078 g. (Cl<sub>2</sub> is diatomic: M = 70.90, not 35.45.)"]}, {"s": "Solutions & colligative properties", "t": "colt", "q": "Determine the boiling point of an aqueous solution of NaCl obtained by dissolving 0.264 moles of salt in 510 mL of water, knowing that Keb(H2O) = 0.512 °C Kg/mol.", "o": ["100.12 °C", "100.26 °C", "100.89 °C", "100.53 °C"], "a": 3, "e": "Official key: 100.53 °C.", "r": "Exam 23/01/2023 Q7", "off": 1, "w": ["Data: 0.264 mol NaCl in 510 mL water (≈ 0.510 kg); K<sub>eb</sub> = 0.512. Find: boiling point.", "m = 0.264/0.510 = 0.5176 mol/kg; NaCl → Na<sup>+</sup> + Cl<sup>−</sup> → i = 2.", "ΔT<sub>b</sub> = 0.512 × 0.5176 × 2 = 0.530 °C → T<sub>b</sub> = 100.53 °C."]}, {"s": "Chemical equilibrium", "t": "kp", "q": "For the reaction N2 (g) + H2 (g) ⇄ NH3 (g) Kc=9.60 at 300 °C. What is the value of Kp?", "o": ["2.18 • 10-3", "4.34 • 10-3", "9.17 • 10-3", "8.15 • 10-3"], "a": 1, "e": "Official key: 4.34 • 10-3.", "r": "Exam 23/01/2023 Q8", "off": 1, "w": ["Data: K<sub>c</sub> = 9.60 at 300 °C. The equation as printed is not balanced; the key uses N<sub>2</sub> + 3H<sub>2</sub> ⇌ 2NH<sub>3</sub> (Δn = 2 − 4 = −2).", "K<sub>p</sub> = K<sub>c</sub>(RT)<sup>Δn</sup>, T = 573.15 K.", "RT = 0.0821 × 573.15 = 47.06 → K<sub>p</sub> = 9.60 × (47.06)<sup>−2</sup> = 4.34×10<sup>−3</sup>.", "<b>Note:</b> with the unbalanced equation as printed (N<sub>2</sub> + H<sub>2</sub> ⇌ NH<sub>3</sub>) the question is ambiguous; the official key matches the balanced reaction."]}, {"s": "Acids, bases & pH", "t": "titr", "q": "How many mL of sodium hydroxide 0.2 N are needed to neutralize 100 mL of hydrogen chloride 0.1N?", "o": ["0.05 mL", "200 mL", "100 mL", "50 mL"], "a": 3, "e": "Official key: 50 mL.", "r": "Exam 23/01/2023 Q9", "off": 1, "w": ["Data: 100 mL of 0.1 N HCl; NaOH 0.2 N. Find: mL of NaOH.", "With normality, neutralization is simply N<sub>a</sub>V<sub>a</sub> = N<sub>b</sub>V<sub>b</sub>.", "V<sub>b</sub> = (0.1 × 100)/0.2 = 50 mL."]}, {"s": "Solutions & colligative properties", "t": "conc", "q": "The molality of a solution obtained by dissolving 4.5 g of sodium bromide in 850 g of water is:", "o": ["2.12 • 10-2 mol/kg", "5 • 10-1 mol/kg", "5.13 • 10-3 mol/kg", "5.13 • 10-2 mol/kg"], "a": 3, "e": "Official key: 5.13 • 10-2 mol/kg.", "r": "Exam 23/01/2023 Q10", "off": 1, "w": ["Data: 4.5 g NaBr in 850 g water. Find: molality.", "M<sub>r</sub>(NaBr) = 22.99 + 79.90 = 102.89 g/mol → n = 0.04374 mol.", "m = 0.04374/0.850 kg = 0.0515 mol/kg = 0.0515 mol/kg. (The key 5.13×10<sup>−2</sup> differs by about 0.4% because of rounding; the other options are far off.)"]}, {"s": "Oxidation numbers & redox", "t": "ox", "q": "The oxidation number of tin in Sn(SO4)2 is:", "o": ["-1", "+2", "-2", "+4"], "a": 3, "e": "Official key: +4.", "r": "Exam 23/01/2023 Q11", "off": 1, "w": ["Data: Sn(SO<sub>4</sub>)<sub>2</sub>. Find: oxidation number of Sn.", "Sulfate SO<sub>4</sub><sup>2−</sup> has charge −2; there are two of them: −4.", "The compound is neutral: Sn + 2(−2) = 0 → Sn = +4."]}, {"s": "Oxidation numbers & redox", "t": "bal", "q": "Balance the following chemical reaction: (A) Al (s) + (B) H2SO4 (aq) --> (C) Al2(SO4)3 (aq) + (D) H2 (g)", "o": ["This is not a redox reaction", "The reaction is not correct", "A=2; B=3; C=1; D=3", "A=2; B=3; C=1; D=6"], "a": 2, "e": "Official key: A=2; B=3; C=1; D=3.", "r": "Exam 23/01/2023 Q12", "off": 1, "w": ["Data: Al + H<sub>2</sub>SO<sub>4</sub> → Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> + H<sub>2</sub>.", "Balance Al: 2 Al on the right → A = 2. Balance SO<sub>4</sub>: 3 on the right → B = 3. Balance H: 3 H<sub>2</sub>SO<sub>4</sub> carry 6 H → D = 3 H<sub>2</sub> (6 H).", "Check: Al 2 = 2 ✓; S 3 = 3 ✓; O 12 = 12 ✓; H 6 = 6 ✓. Redox: Al 0 → +3 (oxidized), H +1 → 0 (reduced). Answer: A=2; B=3; C=1; D=3."]}, {"s": "Nomenclature & reactions", "t": "rxn", "q": "Determine how many moles of salt are formed from the reaction of 5 moles of magnesium hydroxide with an excess of sulfuric acid.", "o": ["1 mole", "10 moles", "5 moles", "2.5 moles"], "a": 2, "e": "Official key: 5 moles.", "r": "Exam 23/01/2023 Q13", "off": 1}, {"s": "Solubility (Kps)", "t": "ksp", "q": "A saturated solution of PbF2 contains 0.05 mol/L of Pb2+ ion. Calculate the solubility product (Kps) of the salt:", "o": ["5 • 10-3", "5 • 10-2", "5 • 10-4", "5 • 10-14"], "a": 2, "e": "Official key: 5 • 10-4.", "r": "Exam 23/01/2023 Q14", "off": 1, "w": ["Data: [Pb<sup>2+</sup>] = 0.05 M in a saturated solution of PbF<sub>2</sub>.", "PbF<sub>2</sub> ⇌ Pb<sup>2+</sup> + 2F<sup>−</sup>: [F<sup>−</sup>] = 2 × 0.05 = 0.10 M.", "K<sub>ps</sub> = [Pb<sup>2+</sup>][F<sup>−</sup>]<sup>2</sup> = 0.05 × (0.10)<sup>2</sup> = 5.00×10<sup>−4</sup>."]}, {"s": "Chemical equilibrium", "t": "lech", "q": "For a generic equilibrium reaction aA + bB ⇄ cC + dD, indicate which of the following changes causes a shift of the equilibrium to the right:", "o": ["increase of the concentration of A", "decrease of the concentration of A", "increase of the concentration of C", "increase of the concentration of D"], "a": 0, "e": "Official key: increase of the concentration of A.", "r": "Exam 23/01/2023 Q15", "off": 1}, {"s": "Bonding & hybridization", "t": "dat", "q": "In which of the following compounds is there at least one dative bond between two atoms: Fe(NO3)3, Fe2(SO3)3, Pb(NO2)4", "o": ["Pb(NO2)4", "Fe2(SO3)3, Pb(NO2)4", "Fe(NO3)3, Fe2(SO3)3", "Fe(NO3)3, Fe2(SO3)3, Pb(NO2)4"], "a": 2, "e": "Official key: Fe(NO3)3, Fe2(SO3)3.", "r": "Exam 23/01/2023 Q16", "off": 1}, {"s": "Mole & stoichiometry", "t": "mol1", "q": "How many Gallium atoms are in 2.85 · 10-3 mol of gallium?", "o": ["1.2 ·1023", "2.11 · 1026", "4.7 · 1027", "1.72 · 1021"], "a": 3, "e": "Official key: 1.72 · 1021.", "r": "Exam 23/01/2023 Q17", "off": 1, "w": ["Atoms = n × N<sub>A</sub> = 2.85×10<sup>−3</sup> × 6.022×10<sup>23</sup> = 1.72×10<sup>21</sup>."]}, {"s": "Bonding & hybridization", "t": "hyb", "q": "The hybridization of sulphur in SO2 is:", "o": ["sp", "no hybridization", "sp2", "sp3"], "a": 2, "e": "Official key: sp2.", "r": "Exam 23/01/2023 Q18", "off": 1}, {"s": "Acids, bases & pH", "t": "titr", "q": "How much water should be added to 1 L of HCl solution having pH=2 to obtain a pH=4?", "o": ["100 L", "98 L", "99 L", "101 L"], "a": 2, "e": "Official key: 99 L.", "r": "Exam 23/01/2023 Q19", "off": 1, "w": ["Data: 1 L HCl at pH 2 → pH 4. Find: water to add.", "Strong acid: [H<sup>+</sup>] = 10<sup>−pH</sup>. pH 2 → 10<sup>−2</sup> M; pH 4 → 10<sup>−4</sup> M: a 100-fold dilution.", "Moles of H<sup>+</sup> are constant: 10<sup>−2</sup> × 1 L = 10<sup>−4</sup> × V<sub>f</sub> → V<sub>f</sub> = 100 L.", "Water added = V<sub>f</sub> − V<sub>i</sub> = 100 − 1 = 99 L. (Trap: 100 L is the final volume.)"]}, {"s": "Quantum numbers", "t": "qnorb", "q": "Which of the following quantum number sets describes a 5d orbital?", "o": ["n=6, l=2, m(l) = 2", "n=5, l=2, m(l) = 3", "n=5, l=4, m(l) = 2", "n=5, l=2, m(l) = 2"], "a": 3, "e": "Official key: n=5, l=2, m(l) = 2.", "r": "Exam 23/01/2023 Q20", "off": 1}, {"s": "Chemical equilibrium", "t": "kcalc", "q": "A container has 1 mole of CO and 0.5 mol of O2 and a total pressure of 5 atm. If they react: 2CO(g) + O2(g) ⇌ 2CO2(g) The moles of CO2 at equilibrium were found to be 0.2 Calculate the value of the equilibrium constant Kx.", "o": ["0.875", "0.156", "0.044", "0.22"], "a": 3, "e": "Official key: 0.22. Official key uses mole fractions (Kx); check against the lecture definition.", "r": "Exam 23/01/2023 Q24", "off": 1, "w": ["Data: start 1 mol CO + 0.5 mol O<sub>2</sub>, P<sub>tot</sub> = 5 atm; 2CO + O<sub>2</sub> ⇌ 2CO<sub>2</sub>; at equilibrium 0.2 mol CO<sub>2</sub>. Find: K<sub>x</sub>.", "ICE: CO<sub>2</sub> forms 0.2 mol → CO consumed 0.2 → 0.8 mol; O<sub>2</sub> consumed 0.1 → 0.4 mol.", "Total moles at equilibrium = 0.8 + 0.4 + 0.2 = 1.4. Mole fractions: x(CO) = 0.571, x(O<sub>2</sub>) = 0.286, x(CO<sub>2</sub>) = 0.143.", "K<sub>x</sub> = x(CO<sub>2</sub>)<sup>2</sup> / [x(CO)<sup>2</sup>·x(O<sub>2</sub>)] = 0.219.", "Distractors explained: 0.156 = K<sub>n</sub> (moles, without dividing by n<sub>tot</sub>); 0.044 = K<sub>p</sub> = K<sub>x</sub>·P<sup>Δn</sup> = 0.219/5. The key 0.22 is correct for K<sub>x</sub>."]}, {"s": "Mole & stoichiometry", "t": "mol1", "q": "How many moles correspond to 27 g of cobalt (II) sulphate?", "o": ["0.928 mol", "0.174 mol", "0.114 mol", "0.253 mol"], "a": 1, "e": "Official key: 0.174 mol.", "r": "Exam 23/01/2023 Q25", "off": 1, "w": ["M<sub>r</sub>(CoSO<sub>4</sub>) = 58.93 + 32.06 + 4(16.00) = 154.99 g/mol.", "n = 27/154.99 = 0.1742 mol."]}, {"s": "Gases", "t": "charles", "q": "A sample of nitrogen occupies 117 mL at 100°C. At what temperature in °C will it occupy 234 mL if the pressure does not change?", "o": ["473 °C", "none of the above", "200 °C", "746 °C"], "a": 0, "e": "Official key: 473 °C.", "r": "Exam 23/01/2023 Q26", "off": 1, "w": ["Data: V<sub>1</sub> = 117 mL at 100 °C; V<sub>2</sub> = 234 mL, P constant. Charles: V<sub>1</sub>/T<sub>1</sub> = V<sub>2</sub>/T<sub>2</sub> with T in kelvin.", "T<sub>1</sub> = 373.15 K → T<sub>2</sub> = 373.15 × 234/117 = 746.30 K (the volume doubles, so T in kelvin doubles).", "T<sub>2</sub> = 746.30 − 273.15 = 473 °C. Trap: doubling 100 °C gives 200 °C, which is wrong."]}, {"s": "Organic chemistry", "t": "ocis", "q": "Which compound does not exhibit cis-trans isomerism?", "o": ["1,2-dichloroethene", "1,1-dichloroethene", "3-hexene", "2-pentene"], "a": 1, "e": "Official key: 1,1-dichloroethene.", "r": "Exam 23/01/2023 Q27", "off": 1}, {"s": "Electron configurations", "t": "cfg", "q": "Which of the following is the correct electron configuration for Na+:", "o": ["1s2 2s2 2p6", "1s2 2s2 2p6 3s2", "1s2 2s2 2p6 3s1", "None"], "a": 0, "e": "Official key: 1s2 2s2 2p6.", "r": "Exam 23/01/2023 Q28", "off": 1}, {"s": "Acids, bases & pH", "t": "ph", "q": "Determine the pH of an aqueous solution containing 0.0010 M Ca(OH)2.", "o": ["12.1", "2.7", "11.3", "10.2"], "a": 2, "e": "Official key: 11.3.", "r": "Exam 23/01/2023 Q29", "off": 1, "w": ["Data: 0.0010 M Ca(OH)<sub>2</sub> (strong base, 2 OH<sup>−</sup> per formula unit).", "[OH<sup>−</sup>] = 2 × 0.0010 = 0.0020 M → pOH = −log 0.0020 = 2.70.", "pH = 14 − 2.70 = 11.30."]}, {"s": "Solubility (Kps)", "t": "common", "q": "Which of the following salts will decrease the solubility of calcium bromide, if added to the solution?", "o": ["HCl, H2SO4", "CaCl2, HBr, HCl", "HBr, HCl, H2SO4", "CaCl2, HBr"], "a": 3, "e": "Official key: CaCl2, HBr.", "r": "Exam 23/01/2023 Q30", "off": 1}, {"s": "Acids, bases & pH", "t": "ph", "q": "The pOH of a solution of NaOH is 11.30. What is the [H+] for this solution?", "o": ["4.0 x 10-12", "2.0 x 10-3", "5.0 x 10-12", "2.5 x 10-3", "6.2 x 10-8"], "a": 1, "e": "Official key: 2.0 x 10-3.", "r": "Exam sample 3 Q1, Exam sample 4 Q4", "off": 1, "w": ["Data: pOH = 11.30. pH + pOH = 14 → pH = 2.70.", "[H<sup>+</sup>] = 10<sup>−2.70</sup> = 2.00×10<sup>−3</sup> M."]}, {"s": "Acids, bases & pH", "t": "ph", "q": "If Kw is 2.9 x 10-15 at 10oC, what is the pH of pure water at 10oC?", "o": ["7.00", "none of these", "7.27", "7.53", "6.72"], "a": 2, "e": "Official key: 7.27.", "r": "Exam sample 3 Q2, Exam sample 4 Q6", "off": 1, "w": ["Data: K<sub>w</sub> = 2.9×10<sup>−15</sup> at 10 °C. In pure water [H<sup>+</sup>] = [OH<sup>−</sup>] = √K<sub>w</sub>.", "[H<sup>+</sup>] = √(2.9×10<sup>−15</sup>) = 5.39×10<sup>−8</sup> M → pH = 7.27 (neutral water at 10 °C is above 7 because K<sub>w</sub> is smaller than at 25 °C)."]}, {"s": "Gases", "t": "ideal", "q": "What pressure (in atm) would be exerted by a mixture of 1.4 g of nitrogen gas and 4.8 g of oxygen gas in a 200 mL container at 57oC?", "o": ["34", "4.7", "47", "0.030", "27"], "a": 4, "e": "Official key: 27.", "r": "Exam sample 3 Q3", "off": 1, "w": ["Data: 1.4 g N<sub>2</sub> + 4.8 g O<sub>2</sub> in 200 mL at 57 °C. Find: total pressure.", "All gases occupy the same volume, so P<sub>tot</sub> = n<sub>tot</sub>RT/V.", "n(N<sub>2</sub>) = 1.4/28.01 = 0.0500; n(O<sub>2</sub>) = 4.8/32.00 = 0.1500; n<sub>tot</sub> = 0.2000 mol.", "P = 0.2000 × 0.0821 × 330.15 / 0.200 = 27.1 atm."]}, {"s": "Chemical equilibrium", "t": "lech", "q": "For a specific reaction, which of the following statements can be made about K, the equilibrium constant?", "o": ["It may be changed by the addition of a catalyst.", "It increases if the concentration of one of the reactants is increased.", "It always remains the same at different reaction conditions.", "It increases if the concentration of one of the products is increased.", "It changes with changes in the temperature."], "a": 4, "e": "Official key: It changes with changes in the temperature..", "r": "Exam sample 3 Q5, Exam sample 5 Q6", "off": 1}, {"s": "Gases", "t": "boyle", "q": "A sample of oxygen occupies 47.2 liters under a pressure of 1240 torr at 25oC. What volume would it occupy at 25oC if the pressure were decreased to 730 torr?", "o": ["27.8 L", "47.8 L", "80.2 L", "29.3 L", "32.3 L"], "a": 2, "e": "Official key: 80.2 L.", "r": "Exam sample 3 Q6", "off": 1, "w": ["Data: V<sub>1</sub> = 47.2 L at 1240 torr; P<sub>2</sub> = 730 torr, T constant. Boyle: P<sub>1</sub>V<sub>1</sub> = P<sub>2</sub>V<sub>2</sub>.", "V<sub>2</sub> = 47.2 × 1240/730 = 80.2 L (pressure drops, volume rises ✓)."]}, {"s": "Nomenclature & reactions", "t": "nmw", "q": "Which name/formula combination is WRONG?", "o": ["sodium chromate / Na2CrO4", "acetate ion / CH3COO-", "calcium hypobromite / Ca(BrO)2", "nitrogen oxide / NO", "phosphorous acid / H3PO4"], "a": 4, "e": "Official key: phosphorous acid / H3PO4.", "r": "Exam sample 3 Q7, Exam sample 5 Q21", "off": 1}, {"s": "Gases", "t": "ideal", "q": "A container with volume 71.9 mL contains water vapor at a pressure of 10.4 atm and a temperature of 465oC. How many grams of the gas are in the container?", "o": ["0.183 g", "0.363 g", "0.222 g", "0.421 g", "0.129 g"], "a": 2, "e": "Official key: 0.222 g.", "r": "Exam sample 3 Q8", "off": 1, "w": ["Data: V = 71.9 mL = 0.0719 L; P = 10.4 atm; T = 465 °C = 738.15 K; gas H<sub>2</sub>O.", "n = PV/RT = (10.4 × 0.0719)/(0.0821 × 738.15) = 0.01234 mol.", "m = 0.01234 × 18.02 = 0.222 g."]}, {"s": "Solubility (Kps)", "t": "ksp", "q": "The Kps of RaSO4 is 4.2*10-11 mol2/L2. If 25mg of RaSO4 are placed in 100mL of water, how many mg of salt are dissolved?", "o": ["2.08mg", "12.5mg", "25mg", "0.208mg", "0.104mg"], "a": 3, "e": "Official key: 0.208mg.", "r": "Exam sample 3 Q9", "off": 1, "w": ["Data: K<sub>ps</sub>(RaSO<sub>4</sub>) = 4.2×10<sup>−11</sup>; 25 mg in 100 mL. Find: mg dissolved.", "RaSO<sub>4</sub> ⇌ Ra<sup>2+</sup> + SO<sub>4</sub><sup>2−</sup>: K<sub>ps</sub> = S<sup>2</sup>.", "S = √(4.2×10<sup>−11</sup>) = 6.48×10<sup>−6</sup> M; in 0.100 L: 6.481e-07 mol.", "M<sub>r</sub>(RaSO<sub>4</sub>) = 226.03 + 96.06 = 322.1 g/mol → 0.209 mg. Since this is less than 25 mg, the solid is in excess and only 0.21 mg dissolve."]}, {"s": "Chemical equilibrium", "t": "lech", "q": "When the system A + B <-> C + D is at equilibrium,", "o": ["the reverse reaction has stopped.", "neither the forward nor the reverse reaction has stopped.", "the forward reaction has stopped.", "both the forward and the reverse reactions have stopped.", "the sum of the concentrations of A and B must equal the sum of the concentrations of C and D."], "a": 1, "e": "Official key: neither the forward nor the reverse reaction has stopped..", "r": "Exam sample 3 Q10", "off": 1}, {"s": "Atom & particles", "t": "cmp", "q": "Consider the species 72Zn, 75As and 74Ge. These species have:", "o": ["the same number of neutrons.", "the same number of protons.", "the same mass number.", "the same number of electrons.", "the same number of protons and neutrons. :"], "a": 0, "e": "Official key: the same number of neutrons..", "r": "Exam sample 3 Q11, Exam sample 4 Q13", "off": 1}, {"s": "Periodic table & trends", "t": "trend", "q": "Which of the following elements has the greatest attraction for electrons in a covalent bond?", "o": ["Se", "Bi", "As", "Ge", "Br"], "a": 4, "e": "Official key: Br.", "r": "Exam sample 3 Q12, Exam sample 5 Q1", "off": 1}, {"s": "Quantum numbers", "t": "last", "q": "Which one of the following sets of quantum numbers could be those of the distinguishing (last) electron of Mo?", "o": ["n = 5, l = 1, ml = 9, ms = -1/2", "n = 4, l = 0, ml = 0, ms = +1/2", "n = 5, l = 2, ml = +2, ms = -1/2", "n = 4, l = 2, ml = -1, ms = +1/2", "n = 3, l = 2, ml = 0, ms = +1/2"], "a": 3, "e": "Official key: n = 4, l = 2, ml = -1, ms = +1/2.", "r": "Exam sample 3 Q13, Exam sample 5 Q5", "off": 1}, {"s": "Gases", "t": "dalton", "q": "A mixture of 90.0 grams of CH4 and 10.0 grams of argon has a pressure of 250 torr under conditions of constant temperature and volume. The partial pressure of CH4 in torr is:", "o": ["26.6", "10.7", "239", "143", "100"], "a": 2, "e": "Official key: 239.", "r": "Exam sample 3 Q14", "off": 1, "w": ["Data: 90.0 g CH<sub>4</sub> + 10.0 g Ar, P<sub>tot</sub> = 250 torr. Find: P(CH<sub>4</sub>).", "n(CH<sub>4</sub>) = 90.0/16.04 = 5.611; n(Ar) = 10.0/39.95 = 0.250.", "x(CH<sub>4</sub>) = 5.611/(5.611+0.250) = 0.9573 → P = 0.9573 × 250 = 239 torr."]}, {"s": "Nomenclature & reactions", "t": "rxn", "q": "The precipitate formed when barium chloride is treated with sulfuric acid is _______ .", "o": ["BaSO3", "BaSO4", "BaS", "BaS2O4", "BaSO2 :"], "a": 1, "e": "Official key: BaSO4.", "r": "Exam sample 3 Q15", "off": 1}, {"s": "Gases", "t": "charles", "q": "A sample of nitrogen occupies 5.50 liters under a pressure of 900 torr at 25oC. At what temperature will it occupy 10.0 liters at the same pressure?", "o": ["-109oC", "269oC", "154oC", "370oC", "32oC"], "a": 1, "e": "Official key: 269oC.", "r": "Exam sample 3 Q16, Exam sample 4 Q12", "off": 1, "w": ["Data: V<sub>1</sub> = 5.50 L at 25 °C; V<sub>2</sub> = 10.0 L; P constant (900 torr is not needed).", "T<sub>2</sub> = 298.15 × 10.0/5.50 = 542.1 K = 269 °C."]}, {"s": "Oxidation numbers & redox", "t": "bal", "q": "Balance the molecular equation for the following redox reaction. What is the sum of the coefficients? Don't forget coefficients of one. Use the smallest whole number coefficients possible. H2SO4(aq) + HI(aq) -> I2(s) + SO2(g)", "o": ["9", "5", "7", "11", "13"], "a": 2, "e": "Official key: 7.", "r": "Exam sample 3 Q17, Exam sample 4 Q17", "off": 1, "w": ["Data: H<sub>2</sub>SO<sub>4</sub> + HI → I<sub>2</sub> + SO<sub>2</sub> (+ H<sub>2</sub>O, product not listed: it is needed to balance H and O).", "Oxidation numbers: S +6 → +4 (gains 2 e<sup>−</sup>, reduced); I −1 → 0 (loses 1 e<sup>−</sup> per I). To balance electrons: 1 S needs 2 I → 2 HI → I<sub>2</sub>.", "H<sub>2</sub>SO<sub>4</sub> + 2HI → I<sub>2</sub> + SO<sub>2</sub> + 2H<sub>2</sub>O. Check H: 2 + 2 = 4 ✓; O: 4 = 2 + 2 ✓.", "Sum of coefficients: 1 + 2 + 1 + 1 + 2 = 7."]}, {"s": "Acids, bases & pH", "t": "ph", "q": "What is the approximate pH of a solution labeled 6 x 10-5 M HBr?", "o": ["9.8", "8.2", "5.8", "4.5", "4.2"], "a": 4, "e": "Official key: 4.2.", "r": "Exam sample 3 Q19, Exam sample 4 Q10", "off": 1, "w": ["HBr is a strong acid: [H<sup>+</sup>] = 6×10<sup>−5</sup> M.", "pH = −log(6×10<sup>−5</sup>) = 4.22 ≈ 4.2."]}, {"s": "Mole & stoichiometry", "t": "mol1", "q": "Which one of the samples contains the most molecules?", "o": ["1 mol of UF6(g)", "1 mol of CO2(g)", "1 mol of He(g)", "all contain the same number of molecules", "1 mol of CH3COCH3(l)"], "a": 3, "e": "Official key: all contain the same number of molecules.", "r": "Exam sample 3 Q20, Exam sample 5 Q29", "off": 1}, {"s": "Periodic table & trends", "t": "trend", "q": "Which element has the lowest first ionization energy?", "o": ["Xe", "Ar", "Kr", "Ne", "He"], "a": 0, "e": "Official key: Xe.", "r": "Exam sample 3 Q22", "off": 1}, {"s": "Acids, bases & pH", "t": "strong", "q": "Which of the following solutions has the lowest pH at 25oC? (No calculations required.)", "o": ["0.2 M sodium hydroxide", "0.2 M ammonia", "0.2 M benzoic acid", "0.2 M hypochlorous acid", "pure water"], "a": 2, "e": "Official key: 0.2 M benzoic acid.", "r": "Exam sample 3 Q24", "off": 1}, {"s": "Chemical equilibrium", "t": "kp", "q": "Kc = 0.040 for the system below at 450oC: PCl5(g) <-> PCl3(g) + Cl2(g) Evaluate Kp for the reaction at 450oC.", "o": ["0.40", "6.7 x 10-4", "0.64", "2.4", "0.052"], "a": 3, "e": "Official key: 2.4.", "r": "Exam sample 3 Q25", "off": 1, "w": ["Reaction PCl<sub>5</sub> ⇌ PCl<sub>3</sub> + Cl<sub>2</sub>: Δn = 2 − 1 = +1; T = 450 + 273.15 = 723.15 K.", "K<sub>p</sub> = K<sub>c</sub>(RT)<sup>Δn</sup> = 0.040 × 0.0821 × 723.15 = 2.37."]}, {"s": "Mole & stoichiometry", "t": "stoich", "q": "Calculate the weight of KClO3 that would be required to produce 29.5 L of oxygen measured at 127oC and 760 torr. 2KClO3(s) -> 2KCl(s) + 3O2(g)", "o": ["14.6 g", "24.4 g", "7.82 g", "12.2 g", "73.5 g"], "a": 4, "e": "Official key: 73.5 g.", "r": "Exam sample 3 Q26", "off": 1, "w": ["Data: 29.5 L O<sub>2</sub> at 127 °C (400.15 K), 760 torr = 1.00 atm; 2KClO<sub>3</sub> → 2KCl + 3O<sub>2</sub>.", "n(O<sub>2</sub>) = PV/RT = (1.00 × 29.5)/(0.0821 × 400.15) = 0.8980 mol.", "Mole ratio 2 KClO<sub>3</sub> : 3 O<sub>2</sub> → n(KClO<sub>3</sub>) = 0.8980 × 2/3 = 0.5986 mol.", "M<sub>r</sub>(KClO<sub>3</sub>) = 122.55 g/mol → m = 73.4 g."]}, {"s": "Mole & stoichiometry", "t": "mol1", "q": "The mass in grams of 2.6 x 1022 chlorine atoms is:", "o": ["1.5", "3.2", "11", "0.76", "4.4 :"], "a": 0, "e": "Official key: 1.5.", "r": "Exam sample 3 Q27", "off": 1, "w": ["n = 2.6×10<sup>22</sup> / 6.022×10<sup>23</sup> = 0.0432 mol of Cl atoms.", "Mass = 0.0432 × 35.45 g/mol = 1.53 g (atomic mass 35.45, because the question says atoms, not Cl<sub>2</sub> molecules)."]}, {"s": "Mole & stoichiometry", "t": "pct", "q": "What mass of cerussite, PbCO3, would contain 35.0 grams of lead?", "o": ["27.1 g", "42.4 g", "35.6 g", "51.7 g", "45.1 g"], "a": 4, "e": "Official key: 45.1 g.", "r": "Exam sample 3 Q28", "off": 1, "w": ["Data: 35.0 g Pb in PbCO<sub>3</sub>.", "Mass fraction of Pb in PbCO<sub>3</sub> = 207.2/267.2 = 0.7754.", "Mass of PbCO<sub>3</sub> = 35.0 / 0.7754 = 45.1 g."]}, {"s": "Chemical equilibrium", "t": "kcalc", "q": "Kc = 0.040 for the system below at 450oC. If a reaction is initiated with 0.40 mole of Cl2 and 0.40 mole of PCl3 in a 2.0 liter container, what is the equilibrium concentration of Cl2 in the same system? PCl5(g) <-> PCl3(g) + Cl2(g)", "o": ["0.16 M", "0.26 M", "0.11 M", "0.07 M", "0.04 M"], "a": 3, "e": "Official key: 0.07 M.", "r": "Exam sample 3 Q30", "off": 1, "w": ["Data: 0.40 mol Cl<sub>2</sub> + 0.40 mol PCl<sub>3</sub> in 2.0 L → each 0.20 M, no PCl<sub>5</sub>. K<sub>c</sub> = 0.040 for PCl<sub>5</sub> ⇌ PCl<sub>3</sub> + Cl<sub>2</sub>.", "There is no PCl<sub>5</sub> at the start, so Q<sub>c</sub> = (0.2)(0.2)/0 is infinite, larger than K<sub>c</sub>: the system moves toward PCl<sub>5</sub> (reverse direction). ICE: PCl<sub>3</sub> and Cl<sub>2</sub> both 0.20 − x, PCl<sub>5</sub> = x.", "K<sub>c</sub> = (0.20 − x)<sup>2</sup>/x = 0.040 → x<sup>2</sup> − 0.44x + 0.04 = 0 → x = 0.1283 (the other root, 0.312, exceeds 0.20 and is rejected).", "[Cl<sub>2</sub>] = 0.20 − 0.1283 = 0.072 M."]}, {"s": "Chemical equilibrium", "t": "qk", "q": "At 445oC, Kc for the following reaction is 0.020. 2HI(g) <-> H2(g) + I2(g) A mixture of H2, I2, and HI in a vessel at 445oC has the following concentrations: [HI] = 2.0 M, [H2] = 0.50 M and [I2] = 0.10 M. Which one of the following statements concerning the reaction quotient, Qc, is TRUE for the above system?", "o": ["Qc is greater than Kc; more H2 and I2 will be produced.", "Qc = Kc; the system is at equilibrium.", "Qc is less than Kc; more H2 and I2 will be produced.", "Qc is greater than Kc; more HI will be produced.", "Qc is less than Kc; more HI will be produced."], "a": 2, "e": "Official key: Qc is less than Kc; more H2 and I2 will be produced..", "r": "Exam sample 4 Q2", "off": 1, "w": ["Data: 2HI ⇌ H<sub>2</sub> + I<sub>2</sub>; K<sub>c</sub> = 0.020; [HI] = 2.0, [H<sub>2</sub>] = 0.50, [I<sub>2</sub>] = 0.10 M.", "Q<sub>c</sub> = [H<sub>2</sub>][I<sub>2</sub>]/[HI]<sup>2</sup> = (0.50 × 0.10)/(2.0)<sup>2</sup> = 0.0125.", "Q<sub>c</sub> = 0.0125 &lt; K<sub>c</sub> = 0.020 → too few products: the reaction proceeds to the right, producing more H<sub>2</sub> and I<sub>2</sub>."]}, {"s": "Solutions & colligative properties", "t": "colt", "q": "What is the freezing point of an aqueous 1.00 m NaCl solution? (Kf = 1.86 oC/m) (Assume complete dissociation of the salt.)", "o": ["-3.72 oC", "-0.93 oC", "0.0 oC", "-1.86 oC", "+1.86 oC"], "a": 0, "e": "Official key: -3.72 oC.", "r": "Exam sample 4 Q3", "off": 1, "w": ["Data: 1.00 m NaCl, K<sub>f</sub> = 1.86, complete dissociation → i = 2.", "ΔT<sub>f</sub> = K<sub>f</sub>·m·i = 1.86 × 1.00 × 2 = 3.72 °C → T<sub>f</sub> = 0 − 3.72 = −3.72 °C."]}, {"s": "Chemical equilibrium", "t": "kcalc", "q": "Consider the reversible reaction at equilibrium at 392oC: 2A(g) + B(g) <-> C(g) The partial pressures are found to be: A: 6.70 atm, B: 10.1 atm, C: 3.60 atm. Evaluate Kp for this reaction.", "o": ["0.0532", "121", "54.5", "0.146", "7.94 x 10-3"], "a": 4, "e": "Official key: 7.94 x 10-3.", "r": "Exam sample 4 Q5", "off": 1, "w": ["Data: 2A + B ⇌ C; P<sub>A</sub> = 6.70, P<sub>B</sub> = 10.1, P<sub>C</sub> = 3.60 atm.", "K<sub>p</sub> = P<sub>C</sub>/(P<sub>A</sub><sup>2</sup>·P<sub>B</sub>) = 3.60/((6.70)<sup>2</sup> × 10.1) = 3.60/453.4 = 7.94×10<sup>−3</sup>."]}, {"s": "Solutions & colligative properties", "t": "colt", "q": "A 250 mL solution containing 21.4 g of a polymer in toluene had an osmotic pressure of 0.055 atm at 27 oC. What is the apparent formula weight of the polymer?", "o": ["32,000 g/mol", "38,000 g/mol", "15,000 g/mol", "26,000 g/mol", "18,000 g/mol"], "a": 1, "e": "Official key: 38,000 g/mol.", "r": "Exam sample 4 Q8", "off": 1, "w": ["Data: 21.4 g polymer in 250 mL, π = 0.055 atm at 27 °C. Find: molar mass.", "π = MRT → M = π/(RT) = 0.055/(0.0821 × 300.15) = 2.232e-03 mol/L.", "n = 2.232e-03 × 0.250 L = 5.580e-04 mol → M<sub>w</sub> = 21.4/5.580e-04 = 38352 g/mol."]}, {"s": "Periodic table & trends", "t": "ion", "q": "Which of the following has a positive charge?", "o": ["electron", "anion", "atom", "proton", "neutron"], "a": 3, "e": "Official key: proton.", "r": "Exam sample 4 Q9", "off": 1}, {"s": "Mole & stoichiometry", "t": "mol1", "q": "How many aluminum atoms are there in 3.50 grams of Al2O3?", "o": ["2.07 x 1022", "4.90 x 1022", "4.13 x 1022", "1.68 x 1022", "2.45 x 1022"], "a": 2, "e": "Official key: 4.13 x 1022.", "r": "Exam sample 4 Q14", "off": 1, "w": ["M<sub>r</sub>(Al<sub>2</sub>O<sub>3</sub>) = 2(26.98) + 3(16.00) = 101.96 g/mol → n = 3.50/101.96 = 0.03433 mol.", "Each formula unit has 2 Al: atoms = 0.03433 × 2 × 6.022×10<sup>23</sup> = 4.13×10<sup>22</sup>."]}, {"s": "Solutions & colligative properties", "t": "conc", "q": "What volume of 12.6 M HCl must be added to enough water to prepare 5.00 liters of 3.00 M HCl?", "o": ["1.19 L", "7.56 L", "21.0 L", "2.14 L", "0.840 L"], "a": 0, "e": "Official key: 1.19 L.", "r": "Exam sample 4 Q18", "off": 1, "w": ["Dilution: M<sub>1</sub>V<sub>1</sub> = M<sub>2</sub>V<sub>2</sub> (moles of HCl constant).", "V<sub>1</sub> = (3.00 × 5.00)/12.6 = 1.190 L."]}, {"s": "Mole & stoichiometry", "t": "mol1", "q": "The weight of a millimole of (NH4)2HPO4 is:", "o": ["0.132 g", "6.02 x 1020 g", "114 g", "1.14 x 10-3 g", "132 g"], "a": 0, "e": "Official key: 0.132 g.", "r": "Exam sample 4 Q19", "off": 1, "w": ["(NH<sub>4</sub>)<sub>2</sub>HPO<sub>4</sub> = N<sub>2</sub>H<sub>9</sub>PO<sub>4</sub>: 2(14.01) + 9(1.008) + 30.97 + 4(16.00) = 132.06 g/mol.", "1 mmol = 10<sup>−3</sup> mol → 0.132 g."]}, {"s": "Periodic table & trends", "t": "def", "q": "Select the term best describing the series of elements: Mn, Fe, Co, Ni, Cu.", "o": ["d-transition metals", "representative elements", "halogens", "alkaline earth metals", "metalloids"], "a": 0, "e": "Official key: d-transition metals.", "r": "Exam sample 4 Q20", "off": 1}, {"s": "Periodic table & trends", "t": "grp", "q": "What alkaline earth metal is located in period 3?", "o": ["Mg", "Ca", "Li", "Na", "Sr"], "a": 0, "e": "Official key: Mg.", "r": "Exam sample 4 Q21", "off": 1}, {"s": "Gases", "t": "gcon", "q": "Which statement is false?", "o": ["The density of a gas is constant as long as its temperature remains constant.", "Gases diffuse into each other and mix almost immediately when put into the same container.", "Pressure must be exerted on a sample of a gas in order to confine it.", "Gases can be expanded without limit.", "The molecular weight of a gaseous compound is a non-variable quantity."], "a": 0, "e": "Official key: The density of a gas is constant as long as its temperature remains constant..", "r": "Exam sample 4 Q22", "off": 1}, {"s": "Gases", "t": "gcon", "q": "Three 1.0 liter flasks are filled with H2, O2 and Ne, respectively, at STP. Which of the following statements is true?", "o": ["The density of each gas is the same.", "The velocity of the gas molecules is the same in each flask.", "Each flask has the same number of gas molecules.", "There are twice as many O2 and H2 molecules as Ne atoms.", "None of the above is true."], "a": 2, "e": "Official key: Each flask has the same number of gas molecules..", "r": "Exam sample 4 Q23", "off": 1}, {"s": "Acids, bases & pH", "t": "titr", "q": "How many grams of NaOH would be required to neutralize all the acid in 75.0 mL of 0.0900 N H2SO4?", "o": ["0.859 g", "1.32 g", "0.660 g", "0.270 g", "0.540 g"], "a": 3, "e": "Official key: 0.270 g.", "r": "Exam sample 4 Q24", "off": 1, "w": ["Data: 75.0 mL of 0.0900 N H<sub>2</sub>SO<sub>4</sub>; NaOH 40.00 g/mol, 1 eq/mol.", "Equivalents of acid = 0.0900 eq/L × 0.0750 L = 0.00675 eq = equivalents of NaOH.", "Mass = 0.00675 × 40.00 g/eq = 0.270 g."]}, {"s": "Electron configurations", "t": "cfg", "q": "The ground state electron configuration for arsenic is:", "o": ["[Kr] 4s2 4p1", "1s2 2s2 2p6 3s2 3p6 4s2 3d8 4p5", "1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p3", "1s2 2s2 2p6 3s2 3p6 3d12 4s2 4p1", "[Ar] 4s2 4p13"], "a": 2, "e": "Official key: 1s2 2s2 2p6 3s2 3p6 4s2 3d10 4p3.", "r": "Exam sample 4 Q25", "off": 1}, {"s": "Quantum numbers", "t": "cap", "q": "The maximum number of electrons that can be accommodated in a sublevel for which l = 3 is:", "o": ["8", "6", "14", "10", "2"], "a": 2, "e": "Official key: 14.", "r": "Exam sample 4 Q26", "off": 1}, {"s": "Mole & stoichiometry", "t": "pct", "q": "Analysis of a sample of a covalent compound showed that it contained 14.4% hydrogen and 85.6% carbon by mass. What is the empirical formula for the compound?", "o": ["C2H3", "none of these", "CH", "CH3", "CH2"], "a": 4, "e": "Official key: CH2.", "r": "Exam sample 4 Q27", "off": 1, "w": ["Data: 14.4% H, 85.6% C. Find: empirical formula. Assume 100 g.", "C: 85.6/12.01 = 7.127 mol; H: 14.4/1.008 = 14.286 mol.", "Ratio H/C = 2.004 ≈ 2 → CH<sub>2</sub>."]}, {"s": "Solubility (Kps)", "t": "ksp", "q": "Calculate the solubility of CaCL2 (Kps=3.4*10-11 mol3/L3) in pure water and in CaBr2 1M.", "o": ["1.04*10-14 M; 2.8*10-6 M", "2.04*10-4 M; 1.0*10-18 M", "8.39*10-6 M; 5.55*10-14 M", "3.42*10-6 M; 2*10-11 M", "2.04*10-4 M; 2.8*10-6 M"], "a": 4, "e": "Official key: 2.04*10-4 M; 2.8*10-6 M.", "r": "Exam sample 4 Q29", "off": 1, "w": ["Data: K<sub>ps</sub> = 3.4×10<sup>−11</sup> for the 1:2 salt CaCl<sub>2</sub> (as written in the exam); CaBr<sub>2</sub> 1 M supplies Ca<sup>2+</sup> (common ion).", "Pure water: K<sub>ps</sub> = 4S<sup>3</sup> → S = (8.50e-12)<sup>1/3</sup> = 2.04×10<sup>−4</sup> M.", "In 1 M CaBr<sub>2</sub>: [Ca<sup>2+</sup>] ≈ 1 M, [Cl<sup>−</sup>] = 2S → 1·(2S)<sup>2</sup> = K<sub>ps</sub> → S = √K<sub>ps</sub>/2 = 2.92×10<sup>−6</sup> M.", "<b>Check:</b> the second value is 2.92×10<sup>−6</sup> M, the key says 2.8×10<sup>−6</sup>: a 3% difference in the exam key (rounding). The first value matches. The option with 2.8×10<sup>−6</sup> M is still the only one with the right pair of values."]}, {"s": "Solutions & colligative properties", "t": "conc", "q": "What is the molality of a solution labeled \"8.6% glucose (C6H12O6) by weight?\" (Note: If the question does not give the solvent, assume it is water.)", "o": ["0.26 m", "0.44 m", "0.34 m", "0.67 m", "0.52 m"], "a": 4, "e": "Official key: 0.52 m.", "r": "Exam sample 4 Q30", "off": 1, "w": ["Data: 8.6% w/w glucose → 8.6 g glucose + 91.4 g water per 100 g solution.", "n = 8.6/180.16 = 0.0477 mol; solvent = 0.0914 kg.", "m = 0.0477/0.0914 = 0.522 mol/kg."]}, {"s": "Mole & stoichiometry", "t": "stoich", "q": "What total gas volume (in liters) at 520oC and 880 torr would result from the decomposition of 33 g of potassium bicarbonate according to the equation: 2KHCO3(s) -> K2CO3(s) + CO2(g) + H2O(g)", "o": ["56 L", "12 L", "10 L", "37 L", "19 L"], "a": 4, "e": "Official key: 19 L.", "r": "Exam sample 5 Q2", "off": 1, "w": ["Data: 33 g KHCO<sub>3</sub>, 2KHCO<sub>3</sub> → K<sub>2</sub>CO<sub>3</sub> + CO<sub>2</sub> + H<sub>2</sub>O, products CO<sub>2</sub> and H<sub>2</sub>O both gases at 520 °C and 880 torr.", "n(KHCO<sub>3</sub>) = 33/100.12 = 0.3296 mol. 2 mol KHCO<sub>3</sub> give 1 CO<sub>2</sub> + 1 H<sub>2</sub>O = 2 mol gas → total gas = 0.3296 mol.", "P = 880/760 = 1.1579 atm; T = 793.15 K.", "V = nRT/P = 0.3296 × 0.0821 × 793.15 / 1.1579 = 18.5 L. (K<sub>2</sub>CO<sub>3</sub> is a solid and does not count.)"]}, {"s": "Oxidation numbers & redox", "t": "agent", "q": "Consider the following reaction: 4NH3 + 5O2 -> 4NO + 6H2O The element being oxidized and the oxidizing agent are:", "o": ["O and NH3", "H and NH3", "N and NH3", "N and O2", "O and O2"], "a": 3, "e": "Official key: N and O2.", "r": "Exam sample 5 Q4", "off": 1}, {"s": "Gases", "t": "ideal", "q": "What is the density of ammonia gas at 2.00 atm pressure and a temperature of 25.0oC?", "o": ["16.6 g/L", "0.695 g/L", "1.39 g/L", "0.720 g/L", "0.980 g/L"], "a": 2, "e": "Official key: 1.39 g/L.", "r": "Exam sample 5 Q7", "off": 1, "w": ["d = PM/RT (from PV = nRT with n = m/M).", "d = (2.00 × 17.03)/(0.0821 × 298.15) = 1.391 g/L."]}, {"s": "Solutions & colligative properties", "t": "conc", "q": "How many grams of Ca(OH)2 are contained in 1500 mL of 0.0250 M Ca(OH)2 solution?", "o": ["4.25 g", "1.85 g", "3.17 g", "2.34 g", "2.78 g"], "a": 4, "e": "Official key: 2.78 g.", "r": "Exam sample 5 Q8", "off": 1, "w": ["n = 0.0250 mol/L × 1.500 L = 0.0375 mol; M<sub>r</sub>[Ca(OH)<sub>2</sub>] = 74.10 g/mol.", "m = 0.0375 × 74.10 = 2.78 g."]}, {"s": "Mole & stoichiometry", "t": "pct", "q": "Calculate the percent, by weight, of carbon i
