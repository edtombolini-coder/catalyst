    app.querySelectorAll('[data-n]').forEach(function(b){b.onclick=function(){len=+b.dataset.n;draw()}});
    app.querySelectorAll('[data-ss]').forEach(function(b){b.onclick=function(){simSrc=b.dataset.ss;draw()}});
    var sh=document.getElementById('shuf');if(sh)sh.onchange=function(e){shufOpt=e.target.checked};
  };
  draw();
}
var lastSecs=[];
function start(secs){
  lastSecs=secs;
  if(mode==='sim'){startSim(secs);return}
  if(mode==='gen'){list=gen(secs,len)}
  else{list=Q.filter(function(x){return secs.indexOf(x.s)>=0});list=shufOpt?shuf(list):list.slice()}
  if(!list.length){app.innerHTML='<h1>No <span>questions</span></h1><p class="sub">The official set has no questions for the selected topics. Switch to New questions or select other topics.</p><button class="btn" id="bk">BACK</button>';document.getElementById('bk').onclick=home;return}
  i=0;score=0;miss=[];rl=[];show();
}
function show(){
  var x=list[i],idx=x.o.map(function(_,k){return k});idx=shuf(idx);var L='ABCDE';
  var h=leaveBar()+'<div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div><div class="meta"><span>'+(i+1)+' / '+list.length+'</span><span class="sec">'+x.s+'</span><span>score '+score+'</span></div><div class="card"><p class="q">'+x.q+'</p>'+figHtml(x)+'<div class="opts">';
  idx.forEach(function(k,p){h+='<button class="opt" data-k="'+k+'"><b>'+L[p]+'</b><span>'+x.o[k]+'</span></button>'});
  h+='</div><div id="fb"></div></div>';
  app.innerHTML=h;setupLeave(false);
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(x,+b.dataset.k)}});
}
function how(x){var m=M[x.t];if(!m)return'';var h='<div class="how"><strong>HOW TO SOLVE THIS TYPE: '+m[0].toUpperCase()+'</strong><p>'+m[1]+'</p><ol>';m[2].forEach(function(t){h+='<li>'+t+'</li>'});return h+'</ol></div>'}
function answer(x,k){
  var ok=k===x.a;if(ok)score++;else{miss.push(x);addMistake(x,x.o[k])}
  statRec(x.s,ok);saveS();rl.push({s:x.s,ok:ok});
  app.querySelectorAll('.opt').forEach(function(b){b.disabled=true;var bk=+b.dataset.k;if(bk===x.a)b.classList.add('ok');else if(bk===k)b.classList.add('no')});
  var last=i===list.length-1;
  document.getElementById('fb').innerHTML='<div class="fb"><strong>'+(ok?'CORRECT':'WRONG')+'</strong>'+x.e+'<span class="src">Source: '+(x.r||'')+'</span></div>'+bookHtml(x)+wkHtml(x)+how(x)+reportBtn(x)+(ok?'':'<p class="sub" style="margin:12px 0 0">Saved in the mistakes box with the full explanation of the topic.</p>')+'<div class="next"><button class="btn" id="nx">'+(last?'SEE RESULT':'NEXT')+'</button></div>';
  var nx=document.getElementById('nx');nx.focus();
  nx.onclick=function(){i++;if(i>=list.length)end();else show()};
}
function breakdown(rows){
  var by={};rows.forEach(function(r){var o=by[r.s]||(by[r.s]={c:0,t:0});o.t++;if(r.ok)o.c++});
  var h='<table><tr><th>Topic</th><th>Correct</th><th></th></tr>';
  secsAll.forEach(function(s){var o=by[s];if(!o)return;var p=Math.round(o.c/o.t*100);h+='<tr><td>'+s+'</td><td>'+o.c+' / '+o.t+' ('+p+'%)</td><td>'+pctBar(p,5)+'</td></tr>'});
  return h+'</table>'}
function end(){
  var pct=Math.round(score/list.length*100);
  var h='<div class="bar"><i style="width:100%"></i></div><div class="meta"><span>Result</span><span class="sec">'+(mode==='gen'?'New questions':'Official')+'</span></div><div class="card"><div class="score">'+score+'/'+list.length+'</div><p class="sub">'+pct+'% correct. Exam scale: 30 questions, pass at 18 (60%).</p>';
  h+='<p class="sec">By topic (this round)</p>'+breakdown(rl);
  if(miss.length){h+='<p class="sec">Wrong this round</p><ul class="miss">';miss.forEach(function(x){h+='<li>'+x.q+'<br><span style="color:var(--neon)">→ '+x.o[x.a]+'</span></li>'});h+='</ul>'}else h+='<p>No mistakes.</p>';
  h+='<div class="row"><button class="btn" id="again">NEW SET</button>'+(miss.length?'<button class="btn ghost" id="mb">MISTAKES BOX ('+MEM.length+')</button>':'')+'<button class="btn ghost" id="stb">STATISTICS</button><button class="btn ghost" id="menu">MENU</button></div></div>';
  h+=credit();app.innerHTML=h;
  document.getElementById('again').onclick=function(){start(lastSecs)};
  var mb=document.getElementById('mb');if(mb)mb.onclick=mistakes;
  document.getElementById('stb').onclick=stats;
  document.getElementById('menu').onclick=home;
}

/* ===== exam simulation ===== */
var SIMN=30,SIMMIN=50;
function startSim(secs){
  var pool=Q.filter(function(x){return secs.indexOf(x.s)>=0}),L=[];
  if(simSrc==='gen')L=gen(secs,SIMN);
  else if(simSrc==='off')L=shuf(pool).slice(0,SIMN);
  else{L=shuf(pool).slice(0,SIMN/2);L=L.concat(gen(secs,SIMN-L.length))}
  if(!L.length){app.innerHTML='<h1>No <span>questions</span></h1><p class="sub">No questions for this selection. Choose other topics or another source.</p><button class="btn" id="bk">BACK</button>';document.getElementById('bk').onclick=home;return}
  L=shuf(L);
  stopTimer();
  sim={L:L,ans:L.map(function(){return -1}),ord:L.map(function(x){return shuf(x.o.map(function(_,k){return k}))}),i:0,t0:Date.now(),end:Date.now()+SIMMIN*60000,askSubmit:false};
  simTimer=setInterval(simTick,1000);
  simShow();
}
function mmss(ms){var s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function simTick(){
  if(!sim)return;var r=sim.end-Date.now();
  if(r<=0){finishSim(true);return}
  var t=document.getElementById('tm');if(t){t.textContent=mmss(r);t.className='timer'+(r<5*60000?' low':'')}
}
function simShow(){
  var x=sim.L[sim.i],L='ABCDE',n=sim.L.length,done=sim.ans.filter(function(a){return a>=0}).length;
  var h=leaveBar()+'<div class="meta"><span>Question '+(sim.i+1)+' / '+n+'</span><span class="sec">EXAM SIMULATION · '+done+' answered</span><span id="tm" class="timer">'+mmss(sim.end-Date.now())+'</span></div><div class="grid">';
  for(var g=0;g<n;g++)h+='<button class="gb'+(sim.ans[g]>=0?' an':'')+(g===sim.i?' cur':'')+'" data-g="'+g+'" aria-label="Go to question '+(g+1)+'">'+(g+1)+'</button>';
  h+='</div><div class="card"><p class="sec" style="margin:0 0 10px">'+x.s+'</p><p class="q">'+x.q+'</p>'+figHtml(x)+'<div class="opts">';
  sim.ord[sim.i].forEach(function(k,p){h+='<button class="opt'+(sim.ans[sim.i]===k?' sel':'')+'" data-k="'+k+'" aria-pressed="'+(sim.ans[sim.i]===k)+'"><b>'+L[p]+'</b><span>'+x.o[k]+'</span></button>'});
  h+='</div><div class="next" style="justify-content:space-between;gap:10px;flex-wrap:wrap"><button class="btn ghost" id="pv" '+(sim.i===0?'disabled':'')+'>PREVIOUS</button>'+(sim.ans[sim.i]>=0?'<button class="btn ghost" id="cl">CLEAR ANSWER</button>':'')+(sim.i<n-1?'<button class="btn" id="nx">NEXT</button>':'<button class="btn" id="sb">SUBMIT EXAM</button>')+'</div>';
  if(sim.askSubmit){h+='<div class="fb" style="margin-top:16px"><strong>SUBMIT THE EXAM?</strong>'+(n-done)+' question'+(n-done===1?' is':'s are')+' unanswered (they score 0). You cannot change answers after submitting.<div class="row" style="margin-top:12px"><button class="btn" id="ok">YES, SUBMIT</button><button class="btn ghost" id="no">KEEP WORKING</button></div></div>'}
  else h+='<p class="sub" style="margin:16px 0 0"><button class="chip" id="sb2">Submit now</button></p>';
  h+='</div>';
  app.innerHTML=h;setupLeave(true);
  app.querySelectorAll('.gb').forEach(function(b){b.onclick=function(){sim.i=+b.dataset.g;sim.askSubmit=false;simShow()}});
  app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){sim.ans[sim.i]=+b.dataset.k;simShow()}});
  var e=function(id,f){var el=document.getElementById(id);if(el)el.onclick=f};
  e('pv',function(){sim.i--;sim.askSubmit=false;simShow()});
  e('nx',function(){sim.i++;sim.askSubmit=false;simShow()});
  e('cl',function(){sim.ans[sim.i]=-1;simShow()});
  e('sb',function(){sim.askSubmit=true;simShow()});
  e('sb2',function(){sim.askSubmit=true;simShow()});
  e('ok',function(){finishSim(false)});
  e('no',function(){sim.askSubmit=false;simShow()});
}
function finishSim(auto){
  stopTimer();
  var s=sim,n=s.L.length,rows=[],right=0,blank=0;
  s.L.forEach(function(x,q){var a=s.ans[q],ok=a===x.a;if(ok)right++;if(a<0)blank++;rows.push({s:x.s,ok:ok});statRec(x.s,ok);
    if(!ok)addMistake(x,a<0?'(no answer)':x.o[a])});
  var mark=n===SIMN?right:Math.round(right*SIMN/n*10)/10,used=Math.min(Date.now(),s.end)-s.t0;
  HIST.unshift({d:new Date().toISOString().slice(0,16).replace('T',' '),m:mark,n:n,r:right,u:Math.round(used/1000),src:simSrc});if(HIST.length>30)HIST.length=30;saveS();
  var pass=mark>=18;
  var h='<div class="meta"><span>Result</span><span class="sec">EXAM SIMULATION'+(auto?' · time over':'')+'</span><span>'+mmss(used)+' used of '+SIMMIN+':00</span></div><div class="card"><div class="score">'+mark+'/30</div><p class="'+(pass?'pass':'fail')+'" style="font-family:var(--disp);margin:0 0 6px">'+(pass?'PASS':'FAIL')+' (minimum 18/30)</p><p class="sub">'+right+' correct, '+(n-right-blank)+' wrong, '+blank+' unanswered out of '+n+' questions. Scoring as in the course: 1 point per correct answer, 0 for wrong or blank'+(n!==SIMN?'; with only '+n+' questions available the mark is scaled to 30':'')+'.</p>';
  h+='<p class="sec">By topic</p>'+breakdown(rows);
  h+='<p class="sec" style="margin-top:18px">Review of every question</p>';
  s.L.forEach(function(x,q){var a=s.ans[q],ok=a===x.a;
    h+='<div class="rv"><span class="st '+(ok?'pass':'fail')+'">'+(q+1)+'. '+(ok?'CORRECT':a<0?'UNANSWERED':'WRONG')+'</span> <span class="lbl">· '+x.s+'</span><p class="q" style="font-size:14px;margin:6px 0 8px">'+x.q+'</p>'+figHtml(x)+'<p class="ans" style="margin:0 0 6px;font-size:13px">'+(ok?'':'<span class="fail">You: '+(a<0?'(no answer)':x.o[a])+'</span><br>')+'<span class="pass">Correct: '+x.o[x.a]+'</span></p><div class="fb" style="margin-top:8px">'+x.e+'<span class="src">Source: '+(x.r||'')+'</span></div>'+bookHtml(x)+wkHtml(x)+reportBtn(x)+'</div>'});
  h+='<div class="row" style="margin-top:18px"><button class="btn" id="again">NEW SIMULATION</button><button class="btn ghost" id="mb">MISTAKES BOX ('+MEM.length+')</button><button class="btn ghost" id="stb">STATISTICS</button><button class="btn ghost" id="menu">MENU</button></div></div>';
  sim=null;
  h+=credit();app.innerHTML=h;window.scrollTo&&window.scrollTo(0,0);
  document.getElementById('again').onclick=function(){start(lastSecs)};
  document.getElementById('mb').onclick=mistakes;
  document.getElementById('stb').onclick=stats;
  document.getElementById('menu').onclick=home;
}

/* ===== statistics ===== */
var resetArm=false;
function stats(){
  stopTimer();
  var h='<h1>Your <span>statistics</span></h1><p class="sub">Per topic, over every question you answered in practice and in simulations (unanswered simulation questions count as wrong).'+(stored?' Saved in this browser.':' Browser storage is blocked: kept only until you close the page.')+'</p>';
  var tot=0,cor=0,weak=null,wp=101;
  secsAll.forEach(function(s){var o=ST[s];if(!o)return;tot+=o.t;cor+=o.c;var p=o.c/o.t*100;if(o.t>=5&&p<wp){wp=p;weak=s}});
  if(!tot){h+='<p class="sub">No answers recorded yet. Answer some questions first.</p>'}
  else{
    h+='<div class="card" style="margin-bottom:18px"><p class="sec" style="margin:0 0 6px">Overall</p><p style="margin:0 0 6px;font-size:18px">'+cor+' / '+tot+' correct ('+Math.round(cor/tot*100)+'%)</p>'+(weak?'<p class="sub" style="margin:0">Weakest topic (at least 5 answers): <b class="fail">'+weak+'</b> at '+Math.round(wp)+'%.</p>':'<p class="sub" style="margin:0">A weakest topic appears once a topic has at least 5 answers.</p>')+'</div>';
    h+='<table><tr><th>Topic</th><th>Correct</th><th>%</th><th></th></tr>';
    secsAll.forEach(function(s){var o=ST[s];if(!o){h+='<tr><td>'+s+'</td><td colspan="3" style="color:var(--dim)">no answers yet</td></tr>';return}var p=Math.round(o.c/o.t*100);h+='<tr><td>'+s+'</td><td>'+o.c+' / '+o.t+'</td><td>'+p+'%</td><td>'+pctBar(p,o.t)+'</td></tr>'});
    h+='</table><p class="sub">Bar colour: green ≥ 60%, amber 40–59% or fewer than 5 answers, pink &lt; 40%.</p>';
  }
  if(HIST.length){h+='<p class="sec" style="margin-top:18px">Exam simulations</p><table><tr><th>Date</th><th>Mark</th><th>Time</th><th>Source</th></tr>';
    HIST.forEach(function(r){h+='<tr><td>'+r.d+'</td><td class="'+(r.m>=18?'pass':'fail')+'">'+r.m+'/30</td><td>'+mmss(r.u*1000)+'</td><td>'+({gen:'generated',off:'official',mix:'mixed'}[r.src]||r.src)+'</td></tr>'});
    var avg=HIST.reduce(function(a,r){return a+r.m},0)/HIST.length;h+='</table><p class="sub">Average mark: '+(Math.round(avg*10)/10)+'/30 over '+HIST.length+' simulation'+(HIST.length===1?'':'s')+'.</p>'}
  h+='<div class="row" style="margin-top:18px"><button class="btn" id="back">BACK</button>'+(tot||HIST.length?'<button class="btn ghost" id="rst">'+(resetArm?'CONFIRM: DELETE ALL STATISTICS':'RESET STATISTICS')+'</button>':'')+'</div>';
  app.innerHTML=h;
  document.getElementById('back').onclick=function(){resetArm=false;home()};
  var r=document.getElementById('rst');if(r)r.onclick=function(){if(!resetArm){resetArm=true;stats();return}ST={};HIST=[];resetArm=false;saveS();stats()};
}
function esc(s){return String(s)}
function mistakes(){
  stopTimer();
  var h='<h1>Mistakes <span>box</span></h1>';
  if(!MEM.length){h+='<p class="sub">Empty. Every question you get wrong is saved here with the explanation of the whole topic.</p><button class="btn" id="back">BACK</button>';app.innerHTML=h;document.getElementById('back').onclick=home;return}
  h+='<p class="sub">'+MEM.length+' saved question'+(MEM.length===1?'':'s')+', grouped by topic. Read the topic explanation first, then the questions.'+(stored?' Saved in this browser.':'')+'</p><div class="row" style="margin-bottom:20px"><button class="btn" id="prac">PRACTISE THESE TOPICS</button><button class="btn ghost" id="back">BACK</button><button class="btn ghost" id="clr">CLEAR ALL</button></div>';
  var groups={};MEM.forEach(function(m){var g=TM[m.t]||'comp';(groups[g]=groups[g]||[]).push(m)});
  Object.keys(groups).forEach(function(g){
    h+='<section class="card" style="margin-bottom:18px"><p class="sec" style="margin:0 0 6px">'+TT[g][0]+' · '+groups[g].length+'</p><div class="topic">'+TT[g][1]+'</div><p class="sec" style="margin:18px 0 8px">Your mistakes</p>';
    groups[g].forEach(function(m){var src=QBY[m.id];h+='<div class="mi"><p class="q" style="font-size:14px">'+m.q+'</p>'+(src?figHtml(src):'')+'<p class="ans"><span class="bad">You: '+m.picked+'</span><span class="good">Correct: '+m.correct+'</span></p><p class="why">'+m.e+'</p>'+(src?bookHtml(src):'')+(src?wkHtml(src):'')+'<button class="chip" data-del="'+encodeURIComponent(m.id)+'">Got it, remove</button></div>'});
    h+='</section>'});
  app.innerHTML=h;
  document.getElementById('back').onclick=home;
  document.getElementById('clr').onclick=function(){MEM=[];saveM();mistakes()};
  document.getElementById('prac').onclick=function(){var s=[];Object.keys(groups).forEach(function(g){if(s.indexOf(TSEC[g])<0)s.push(TSEC[g])});mode='gen';start(s)};
  app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){var id=decodeURIComponent(b.dataset.del);MEM=MEM.filter(function(m){return m.id!==id});saveM();mistakes()}});
}
loadM();home();

</script>
